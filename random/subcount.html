<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GuiTakeya — Live Subscriber Count</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            color: white;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 20, 147, 0.28),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(255, 0, 180, 0.22),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 50% 50%,
                    rgba(180, 0, 255, 0.12),
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    #080308,
                    #180812,
                    #100512,
                    #050305
                );

            background-size:
                200% 200%;

            animation:
                backgroundMove 15s ease infinite;
        }


        /* =====================================================
           ANIMATED BACKGROUND
        ===================================================== */

        @keyframes backgroundMove {

            0% {
                background-position:
                    0% 50%;
            }

            50% {
                background-position:
                    100% 50%;
            }

            100% {
                background-position:
                    0% 50%;
            }

        }


        .background {

            position:
                fixed;

            inset:
                0;

            overflow:
                hidden;

            pointer-events:
                none;

            z-index:
                0;

        }


        /* =====================================================
           GLOWING ORBS
        ===================================================== */

        .orb {

            position:
                absolute;

            border-radius:
                50%;

            filter:
                blur(90px);

            opacity:
                0.4;

            mix-blend-mode:
                screen;

        }


        .orb.one {

            width:
                380px;

            height:
                380px;

            background:
                rgba(
                    255,
                    0,
                    140,
                    0.55
                );

            left:
                -120px;

            top:
                5%;

            animation:
                orbOne 20s ease-in-out infinite;

        }


        .orb.two {

            width:
                320px;

            height:
                320px;

            background:
                rgba(
                    200,
                    0,
                    255,
                    0.45
                );

            right:
                -100px;

            bottom:
                0;

            animation:
                orbTwo 23s ease-in-out infinite;

        }


        .orb.three {

            width:
                260px;

            height:
                260px;

            background:
                rgba(
                    255,
                    60,
                    190,
                    0.35
                );

            left:
                45%;

            top:
                -130px;

            animation:
                orbThree 28s ease-in-out infinite;

        }


        @keyframes orbOne {

            0%, 100% {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    scale(1);

            }

            50% {

                transform:
                    translate3d(
                        220px,
                        130px,
                        0
                    )
                    scale(1.3);

            }

        }


        @keyframes orbTwo {

            0%, 100% {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    scale(1);

            }

            50% {

                transform:
                    translate3d(
                        -180px,
                        -120px,
                        0
                    )
                    scale(1.25);

            }

        }


        @keyframes orbThree {

            0%, 100% {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    );

            }

            50% {

                transform:
                    translate3d(
                        -100px,
                        180px,
                        0
                    );

            }

        }


        /* =====================================================
           FLOATING GLASS SHAPES
        ===================================================== */

        .shape {

            position:
                absolute;

            border:
                1px solid
                rgba(
                    255,
                    150,
                    220,
                    0.10
                );

            background:
                linear-gradient(
                    135deg,
                    rgba(
                        255,
                        120,
                        200,
                        0.07
                    ),
                    rgba(
                        255,
                        255,
                        255,
                        0.01
                    )
                );

            backdrop-filter:
                blur(12px);

            box-shadow:
                inset 0 0 30px
                rgba(
                    255,
                    120,
                    220,
                    0.03
                );

            opacity:
                0.45;

        }


        .shape.one {

            width:
                180px;

            height:
                180px;

            left:
                4%;

            top:
                10%;

            border-radius:
                40px;

            animation:
                shapeOne 18s ease-in-out infinite;

        }


        .shape.two {

            width:
                130px;

            height:
                130px;

            right:
                7%;

            top:
                12%;

            border-radius:
                50%;

            animation:
                shapeTwo 15s ease-in-out infinite;

        }


        .shape.three {

            width:
                210px;

            height:
                210px;

            right:
                22%;

            bottom:
                -90px;

            border-radius:
                45px;

            animation:
                shapeThree 22s ease-in-out infinite;

        }


        .shape.four {

            width:
                100px;

            height:
                100px;

            left:
                18%;

            bottom:
                8%;

            border-radius:
                25px;

            animation:
                shapeFour 17s ease-in-out infinite;

        }


        @keyframes shapeOne {

            0%, 100% {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    rotate(25deg);

            }

            50% {

                transform:
                    translate3d(
                        100px,
                        70px,
                        0
                    )
                    rotate(145deg);

            }

        }


        @keyframes shapeTwo {

            0%, 100% {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    scale(1);

            }

            50% {

                transform:
                    translate3d(
                        -90px,
                        100px,
                        0
                    )
                    scale(1.4);

            }

        }


        @keyframes shapeThree {

            0%, 100% {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    rotate(45deg);

            }

            50% {

                transform:
                    translate3d(
                        -110px,
                        -120px,
                        0
                    )
                    rotate(150deg);

            }

        }


        @keyframes shapeFour {

            0%, 100% {

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    )
                    rotate(20deg);

            }

            50% {

                transform:
                    translate3d(
                        70px,
                        -70px,
                        0
                    )
                    rotate(150deg);

            }

        }


        /* =====================================================
           MAIN CARD
        ===================================================== */

        .container {

            position:
                relative;

            z-index:
                10;

            width:
                min(
                    90vw,
                    760px
                );

            min-height:
                380px;

            padding:
                42px;

            display:
                grid;

            grid-template-columns:
                240px 1fr;

            gap:
                42px;

            align-items:
                center;

            background:
                linear-gradient(
                    135deg,
                    rgba(
                        35,
                        12,
                        30,
                        0.82
                    ),
                    rgba(
                        12,
                        5,
                        12,
                        0.74
                    )
                );

            border:
                1px solid
                rgba(
                    255,
                    120,
                    210,
                    0.14
                );

            border-radius:
                32px;

            backdrop-filter:
                blur(28px);

            -webkit-backdrop-filter:
                blur(28px);

            box-shadow:

                0 30px 100px
                rgba(
                    0,
                    0,
                    0,
                    0.70
                ),

                0 0 80px
                rgba(
                    255,
                    0,
                    170,
                    0.09
                ),

                inset 0 1px 0
                rgba(
                    255,
                    180,
                    230,
                    0.08
                );

            animation:
                cardAppear
                0.8s ease-out;

        }


        @keyframes cardAppear {

            from {

                opacity:
                    0;

                transform:
                    translateY(
                        20px
                    )
                    scale(
                        0.97
                    );

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(
                        0
                    )
                    scale(
                        1
                    );

            }

        }


        /* =====================================================
           LEFT SIDE / PROFILE
        ===================================================== */

        .profile {

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

        }


        .pfp-wrapper {

            position:
                relative;

            display:
                inline-block;

        }


        .pfp-glow {

            position:
                absolute;

            inset:
                -20px;

            border-radius:
                50%;

            background:
                rgba(
                    255,
                    0,
                    170,
                    0.30
                );

            filter:
                blur(30px);

            animation:
                pfpGlow
                3s ease-in-out infinite;

        }


        @keyframes pfpGlow {

            0%, 100% {

                opacity:
                    0.45;

                transform:
                    scale(
                        0.95
                    );

            }

            50% {

                opacity:
                    0.85;

                transform:
                    scale(
                        1.08
                    );

            }

        }


        .pfp {

            position:
                relative;

            width:
                210px;

            height:
                210px;

            border-radius:
                50%;

            object-fit:
                cover;

            border:
                5px solid
                #ff4db8;

            box-shadow:

                0 0 0 8px
                rgba(
                    255,
                    0,
                    170,
                    0.08
                ),

                0 0 55px
                rgba(
                    255,
                    0,
                    170,
                    0.45
                );

        }


        .profile-name {

            margin-top:
                22px;

            font-size:
                1.45rem;

            font-weight:
                750;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb6e6
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;

        }


        .profile-handle {

            margin-top:
                3px;

            color:
                #a86d91;

            font-size:
                0.9rem;

        }


        /* =====================================================
           RIGHT SIDE
        ===================================================== */

        .stats {

            position:
                relative;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

        }


        /* =====================================================
           LIVE TOP RIGHT
        ===================================================== */

        .live {

            position:
                absolute;

            right:
                0;

            top:
                0;

            display:
                inline-flex;

            align-items:
                center;

            gap:
                8px;

            padding:
                7px 13px;

            border-radius:
                999px;

            background:
                rgba(
                    255,
                    0,
                    170,
                    0.10
                );

            border:
                1px solid
                rgba(
                    255,
                    70,
                    190,
                    0.28
                );

            color:
                #ff70c8;

            font-size:
                0.72rem;

            font-weight:
                800;

            letter-spacing:
                1.5px;

        }


        .live-dot {

            width:
                8px;

            height:
                8px;

            border-radius:
                50%;

            background:
                #ff209d;

            box-shadow:
                0 0 12px
                #ff209d;

            animation:
                pulse
                1.4s infinite;

        }


        @keyframes pulse {

            0%, 100% {

                opacity:
                    1;

                transform:
                    scale(1);

            }

            50% {

                opacity:
                    0.3;

                transform:
                    scale(
                        0.7
                    );

            }

        }


        /* =====================================================
           SUBSCRIBER COUNT
        ===================================================== */

        .counter-label {

            margin-top:
                25px;

            color:
                #a86d91;

            font-size:
                0.8rem;

            text-transform:
                uppercase;

            letter-spacing:
                4px;

        }


        .counter {

            margin:
                5px 0 0;

            font-size:
                clamp(
                    4rem,
                    9vw,
                    6.5rem
                );

            line-height:
                1;

            font-weight:
                800;

            letter-spacing:
                -5px;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #ffd6ef 45%,
                    #d66aaa 100%
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;

            transition:
                transform
                0.25s ease,

                filter
                0.25s ease;

        }


        .counter.bump {

            transform:
                scale(
                    1.08
                );

            filter:
                drop-shadow(
                    0 0 25px
                    rgba(
                        255,
                        20,
                        170,
                        0.55
                    )
                );

        }


        /* =====================================================
           GOAL BOX
        ===================================================== */

        .goal-box {

            position:
                relative;

            margin-top:
                30px;

            padding:
                18px 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(
                        255,
                        80,
                        190,
                        0.09
                    ),
                    rgba(
                        255,
                        255,
                        255,
                        0.018
                    )
                );

            border:
                1px solid
                rgba(
                    255,
                    120,
                    210,
                    0.13
                );

            border-radius:
                18px;

            box-shadow:

                inset 0 1px 0
                rgba(
                    255,
                    180,
                    230,
                    0.05
                ),

                0 10px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );

            overflow:
                hidden;

        }


        .goal-box::before {

            content:
                "";

            position:
                absolute;

            left:
                0;

            top:
                0;

            bottom:
                0;

            width:
                3px;

            background:
                linear-gradient(
                    180deg,
                    #ff1493,
                    #ff69c4,
                    #c00078
                );

            box-shadow:
                0 0 18px
                rgba(
                    255,
                    20,
                    160,
                    0.7
                );

        }


        .goal-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                11px;

        }


        .goal-title {

            font-size:
                0.8rem;

            font-weight:
                700;

            color:
                #c28aaa;

            text-transform:
                uppercase;

            letter-spacing:
                1.5px;

        }


        .goal-number {

            font-size:
                0.9rem;

            font-weight:
                700;

            color:
                #ff9ed8;

            text-shadow:
                0 0 10px
                rgba(
                    255,
                    50,
                    180,
                    0.35
                );

        }


        .progress {

            width:
                100%;

            height:
                9px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

            border-radius:
                999px;

            overflow:
                hidden;

        }


        .progress-bar {

            height:
                100%;

            width:
                0%;

            background:
                linear-gradient(
                    90deg,
                    #c00078,
                    #ff1493,
                    #ff72c6
                );

            border-radius:
                inherit;

            box-shadow:
                0 0 18px
                rgba(
                    255,
                    20,
                    160,
                    0.65
                );

            transition:
                width
                0.8s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );

        }


        .goal-footer {

            display:
                flex;

            justify-content:
                space-between;

            margin-top:
                8px;

            font-size:
                0.72rem;

            color:
                #76516a;

        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {

            margin-top:
                15px;

            color:
                #76566c;

            font-size:
                0.7rem;

            text-align:
                right;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (
            max-width: 700px
        ) {

            .container {

                width:
                    92vw;

                min-height:
                    auto;

                padding:
                    30px 25px;

                grid-template-columns:
                    1fr;

                gap:
                    25px;

            }


            .pfp {

                width:
                    150px;

                height:
                    150px;

            }


            .stats {

                text-align:
                    center;

            }


            .live {

                position:
                    relative;

                right:
                    auto;

                top:
                    auto;

                align-self:
                    center;

                margin-bottom:
                    15px;

            }


            .counter-label {

                margin-top:
                    0;

            }


            .status {

                text-align:
                    center;

            }

        }


    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background">

        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>

        <div class="shape one"></div>
        <div class="shape two"></div>
        <div class="shape three"></div>
        <div class="shape four"></div>

    </div>


    <!-- =====================================================
         MAIN CARD
    ====================================================== -->

    <div class="container">


        <!-- =================================================
             LEFT — PROFILE
        ================================================== -->

        <div class="profile">

            <div class="pfp-wrapper">

                <div class="pfp-glow"></div>

                <img
                    class="pfp"
                    src="https://yt3.ggpht.com/ttAkTpY31wkOGnatdL3SG8reM98rZ2wVuG950Yno4ZCO9MMH1oyeIpT9ldBO-8KzAws6qeNT=s176-c-k-c0x00ffffff-no-rj"
                    alt="GuiTakeya profile picture"
                >

            </div>


            <div class="profile-name">
                GuiTakeya
            </div>


            <div class="profile-handle">
                @GuiTakeya
            </div>

        </div>


        <!-- =================================================
             RIGHT — STATS
        ================================================== -->

        <div class="stats">


            <!-- LIVE -->

            <div class="live">

                <span class="live-dot"></span>

                LIVE

            </div>


            <!-- COUNTER -->

            <div class="counter-label">
                Subscribers
            </div>


            <div
                class="counter"
                id="subCount"
            >
                —
            </div>


            <!-- =================================================
                 GOAL
            ================================================== -->

            <div class="goal-box">

                <div class="goal-header">

                    <div class="goal-title">
                        Next milestone
                    </div>

                    <div
                        class="goal-number"
                        id="goalText"
                    >
                        100
                    </div>

                </div>


                <div class="progress">

                    <div
                        class="progress-bar"
                        id="progressBar"
                    ></div>

                </div>


                <div class="goal-footer">

                    <span
                        id="currentGoalText"
                    >
                        0 / 100
                    </span>

                    <span>
                        Keep going! ♡
                    </span>

                </div>

            </div>


            <!-- STATUS -->

            <div
                class="status"
                id="status"
            >
                Connecting...
            </div>


        </div>


    </div>


    <!-- =====================================================
         SILK / KEEP-SILK-OPEN
    ====================================================== -->

    <script src="https://dagammla.gitlab.io/keep-silk-open/keep.js"></script>


    <!-- =====================================================
         SUBSCRIBER COUNTER
    ====================================================== -->

    <script>

        const API_URL =
            "https://api.socialcounts.org/youtube-live-subscriber-count/UChg7UoXV1HEtoUgwu0y871w";


        const subCount =
            document.getElementById(
                "subCount"
            );


        const status =
            document.getElementById(
                "status"
            );


        const progressBar =
            document.getElementById(
                "progressBar"
            );


        const goalText =
            document.getElementById(
                "goalText"
            );


        const currentGoalText =
            document.getElementById(
                "currentGoalText"
            );


        let previousCount =
            null;


        async function fetchSubCount() {

            try {

                const response =
                    await fetch(
                        API_URL,
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                const count =
                    data?.counters?.api?.subscriberCount ??
                    data?.counters?.estimation?.subscriberCount;


                if (
                    typeof count !==
                    "number"
                ) {

                    console.log(
                        "API response:",
                        data
                    );

                    throw new Error(
                        "Subscriber count not found."
                    );

                }


                updateCounter(
                    count
                );


                status.innerText =
                    "● Live • Updated " +
                    new Date()
                        .toLocaleTimeString();

            }


            catch (error) {

                console.error(
                    "Error fetching subscriber count:",
                    error
                );


                status.innerText =
                    "Unable to update • Retrying...";

            }

        }


        function updateCounter(
            count
        ) {

            /*
             * Animate the number
             * when it changes.
             */

            if (
                previousCount !==
                null &&
                previousCount !==
                count
            ) {

                subCount.classList.add(
                    "bump"
                );


                setTimeout(
                    () => {

                        subCount.classList.remove(
                            "bump"
                        );

                    },
                    250
                );

            }


            subCount.innerText =
                count.toLocaleString();


            previousCount =
                count;


            /*
             * Find next 100-subscriber
             * milestone.
             */

            const goal =
                Math.ceil(
                    (count + 1) /
                    100
                ) * 100;


            const previousGoal =
                goal - 100;


            let progress =
                (
                    (count - previousGoal) /
                    (goal - previousGoal)
                ) * 100;


            progress =
                Math.min(
                    Math.max(
                        progress,
                        0
                    ),
                    100
                );


            progressBar.style.width =
                progress + "%";


            goalText.innerText =
                goal.toLocaleString();


            currentGoalText.innerText =
                count.toLocaleString() +
                " / " +
                goal.toLocaleString();

        }


        /*
         * Initial request.
         */

        fetchSubCount();


        /*
         * Update every 30 seconds.
         *
         * IMPORTANT:
         *
         * This does NOT reload
         * the webpage.
         *
         * It only fetches the
         * newest subscriber count
         * and updates the elements.
         */

        setInterval(
            fetchSubCount,
            30000
        );

    </script>


</body>
</html>
