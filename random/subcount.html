<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>live sub count</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #1f1f1f;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 2px solid #333;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ff0000;
        }
        .channel-handle {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
        }
        .counter {
            font-size: 5rem;
            font-weight: bold;
            margin: 20px 0;
            letter-spacing: 2px;
            font-family: monospace;
        }
        .update-status {
            font-size: 0.9rem;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GuiTakeya</h1>
        <div class="channel-handle">@GuiTakeya</div>
        <div class="counter" id="subCount">Loading...</div>
        <div class="update-status" id="status">Updating every 60 seconds...</div>
    </div>

    <script src="https://dagammla.gitlab.io/keep-silk-open/keep.js"></script>

    <script>
        
async function fetchSubCount() {
    try {
        const response = await fetch('https://api.socialcounts.org/youtube-live-subscriber-count/UChg7UoXV1HEtoUgwu0y871w');
        const data = await response.json();
        
        // SocialCounts standard layout stores the current count in the counts array or subCount property
        let count = data.subCount || data.counts[0].value;
        
        document.getElementById('subCount').innerText = Number(count).toLocaleString();
        document.getElementById('status').innerText = "Last updated: " + new Date().toLocaleTimeString();
    } catch (error) {
        console.error("Error fetching data:", error);
        document.getElementById('status').innerText = "Retrying next cycle...";
    }
}

fetchSubCount();

setInterval(fetchSubCount, 60000);
    </script>
</body>
</html>
