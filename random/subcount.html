<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=960, height=480, initial-scale=1.0"
>

<title>GuiTakeya Live Dashboard</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 960px;
    height: 480px;

    margin: 0;
    padding: 0;

    overflow: hidden;

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    color: white;

    background:
        linear-gradient(
            135deg,
            #080308,
            #160611 45%,
            #080308
        );
}


/* =========================================================
   BACKGROUND CONTAINER

   IMPORTANT FOR ALEXA/SILK:
   Everything animated stays inside this exact 960x480 box.
========================================================= */

.background {
    position: fixed;

    left: 0;
    top: 0;

    width: 960px;
    height: 480px;

    overflow: hidden;

    pointer-events: none;

    z-index: 0;
}


/* =========================================================
   BACKGROUND LIGHTS
========================================================= */

.light {
    position: absolute;

    border-radius: 50%;

    pointer-events: none;
}

.light.one {
    width: 300px;
    height: 300px;

    left: -70px;
    top: -70px;

    background:
        rgba(255, 0, 150, .22);

    filter: blur(60px);

    animation:
        lightOne 18s ease-in-out infinite;
}

.light.two {
    width: 280px;
    height: 280px;

    left: 750px;
    top: 270px;

    background:
        rgba(180, 0, 255, .20);

    filter: blur(60px);

    animation:
        lightTwo 22s ease-in-out infinite;
}

.light.three {
    width: 220px;
    height: 220px;

    left: 390px;
    top: -80px;

    background:
        rgba(255, 50, 190, .15);

    filter: blur(55px);

    animation:
        lightThree 25s ease-in-out infinite;
}

@keyframes lightOne {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0)
            scale(1);
    }

    50% {
        transform:
            translate3d(120px, 80px, 0)
            scale(1.2);
    }
}

@keyframes lightTwo {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0)
            scale(1);
    }

    50% {
        transform:
            translate3d(-100px, -70px, 0)
            scale(1.2);
    }
}

@keyframes lightThree {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0);
    }

    50% {
        transform:
            translate3d(-70px, 100px, 0);
    }
}


/* =========================================================
   GRID

   Kept inside the viewport instead of using inset:-100px.
========================================================= */

.grid {
    position: absolute;

    left: -40px;
    top: 120px;

    width: 1040px;
    height: 500px;

    opacity: .09;

    background-image:
        linear-gradient(
            rgba(255, 80, 190, .25) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255, 80, 190, .25) 1px,
            transparent 1px
        );

    background-size: 42px 42px;

    transform:
        perspective(350px)
        rotateX(58deg);

    animation:
        gridMove 14s linear infinite;
}

@keyframes gridMove {

    from {
        background-position:
            0 0;
    }

    to {
        background-position:
            0 84px;
    }
}


/* =========================================================
   FLOATING SHAPES
========================================================= */

.shape {
    position: absolute;

    pointer-events: none;

    border:
        1px solid
        rgba(255, 150, 220, .17);

    background:
        linear-gradient(
            135deg,
            rgba(255, 80, 190, .08),
            rgba(255, 255, 255, .01)
        );

    opacity: .55;
}

.shape.one {

    width: 100px;
    height: 100px;

    left: 25px;
    top: 35px;

    border-radius: 25px;

    animation:
        shapeOne 16s ease-in-out infinite;
}

.shape.two {

    width: 75px;
    height: 75px;

    left: 850px;
    top: 40px;

    border-radius: 50%;

    animation:
        shapeTwo 14s ease-in-out infinite;
}

.shape.three {

    width: 120px;
    height: 120px;

    left: 730px;
    top: 370px;

    border-radius: 30px;

    animation:
        shapeThree 20s ease-in-out infinite;
}

.shape.four {

    width: 55px;
    height: 55px;

    left: 270px;
    top: 400px;

    border-radius: 16px;

    animation:
        shapeFour 13s ease-in-out infinite;
}

@keyframes shapeOne {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0)
            rotate(25deg);
    }

    50% {
        transform:
            translate3d(50px, 40px, 0)
            rotate(110deg);
    }
}

@keyframes shapeTwo {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0)
            scale(1);
    }

    50% {
        transform:
            translate3d(-50px, 60px, 0)
            scale(1.25);
    }
}

@keyframes shapeThree {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0)
            rotate(40deg);
    }

    50% {
        transform:
            translate3d(-60px, -55px, 0)
            rotate(120deg);
    }
}

@keyframes shapeFour {

    0%,
    100% {
        transform:
            translate3d(0, 0, 0)
            rotate(15deg);
    }

    50% {
        transform:
            translate3d(45px, -45px, 0)
            rotate(110deg);
    }
}


/* =========================================================
   LIGHT TRAILS

   No negative starting position.
========================================================= */

.trail {
    position: absolute;

    width: 260px;
    height: 2px;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 80, 190, .6),
            transparent
        );

    opacity: .4;
}

.trail.one {

    left: -260px;
    top: 110px;

    transform: rotate(-12deg);

    animation:
        trailOne 12s linear infinite;
}

.trail.two {

    left: -260px;
    top: 360px;

    transform: rotate(8deg);

    animation:
        trailTwo 14s linear infinite;
}

@keyframes trailOne {

    0% {
        left: -260px;
    }

    100% {
        left: 960px;
    }
}

@keyframes trailTwo {

    0% {
        left: -260px;
    }

    100% {
        left: 960px;
    }
}


/* =========================================================
   PARTICLES
========================================================= */

.particles {
    position: absolute;

    left: 0;
    top: 0;

    width: 960px;
    height: 480px;

    overflow: hidden;
}

.particle {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background:
        #ff8bd2;

    box-shadow:
        0 0 8px #ff3cac;

    opacity: .5;

    animation:
        particleFloat
        var(--duration)
        linear
        infinite;

    animation-delay:
        var(--delay);
}

@keyframes particleFloat {

    0% {
        transform:
            translate3d(0, 40px, 0);

        opacity: 0;
    }

    15% {
        opacity: .55;
    }

    85% {
        opacity: .55;
    }

    100% {
        transform:
            translate3d(
                var(--x),
                -430px,
                0
            );

        opacity: 0;
    }
}


/* =========================================================
   MAIN DASHBOARD
========================================================= */

.dashboard {

    position: absolute;

    left: 20px;
    top: 20px;

    width: 920px;
    height: 440px;

    display: grid;

    grid-template-columns:
        390px
        1fr;

    gap: 22px;

    padding: 24px;

    border-radius: 28px;

    background:
        rgba(15, 6, 15, .86);

    border:
        1px solid
        rgba(255, 100, 200, .18);

    box-shadow:
        0 20px 70px
        rgba(0, 0, 0, .55),

        0 0 60px
        rgba(255, 0, 160, .08);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    z-index: 5;
}


/* =========================================================
   LEFT SIDE
========================================================= */

.left {

    display: flex;

    flex-direction: column;

    min-height: 0;
}


/* =========================================================
   PROFILE
========================================================= */

.profile {

    display: flex;

    align-items: center;

    gap: 16px;

    margin-left: 8px;

    margin-top: -4px;

    margin-bottom: 8px;

    flex-shrink: 0;
}

.pfp-wrapper {

    position: relative;

    flex-shrink: 0;
}

.pfp-glow {

    position: absolute;

    inset: -9px;

    border-radius: 50%;

    background:
        rgba(255, 0, 160, .22);

    filter:
        blur(14px);

    animation:
        pfpPulse
        3s ease-in-out infinite;
}

@keyframes pfpPulse {

    0%,
    100% {
        transform: scale(.95);
        opacity: .45;
    }

    50% {
        transform: scale(1.06);
        opacity: .75;
    }
}

.pfp {

    position: relative;

    width: 76px;
    height: 76px;

    object-fit: cover;

    border-radius: 50%;

    border:
        3px solid
        #ff4db8;

    box-shadow:
        0 0 0 5px
        rgba(255, 0, 160, .07),

        0 0 25px
        rgba(255, 0, 160, .4);
}

.profile-info {

    display: flex;

    flex-direction: column;
}

.channel-name {

    font-size: 29px;

    line-height: 1;

    font-weight: 900;

    background:
        linear-gradient(
            90deg,
            white,
            #ff9ed8
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.handle {

    margin-top: 5px;

    color:
        #b887a6;

    font-size: 15px;
}


/* =========================================================
   SUBSCRIBER BOX

   Now uses almost all remaining vertical space.
========================================================= */

.subscriber-box {

    position: relative;

    flex: 1;

    min-height: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    padding:
        15px
        20px
        18px;

    border-radius: 19px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 60, 180, .10),
            rgba(255, 255, 255, .018)
        );

    border:
        1px solid
        rgba(255, 100, 200, .15);

    overflow: hidden;
}


/* =========================================================
   LIVE
========================================================= */

.live {

    position: absolute;

    top: 12px;
    right: 14px;

    display: flex;

    align-items: center;

    gap: 7px;

    padding:
        5px 10px;

    border-radius: 999px;

    background:
        rgba(255, 0, 150, .10);

    border:
        1px solid
        rgba(255, 80, 190, .25);

    color:
        #ff72c5;

    font-size: 10px;

    font-weight: 900;

    letter-spacing: 1.5px;
}

.live-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        #ff219f;

    box-shadow:
        0 0 10px
        #ff219f;

    animation:
        pulse
        1.3s infinite;
}

@keyframes pulse {

    50% {
        opacity: .3;
        transform: scale(.7);
    }
}


/* =========================================================
   SUBSCRIBER LABEL
========================================================= */

.counter-label {

    text-align: center;

    font-size: 13px;

    text-transform: uppercase;

    letter-spacing: 3px;

    color:
        #bd8bab;

    margin-bottom: 2px;
}


/* =========================================================
   BIG SUBSCRIBER COUNT

   This is intentionally huge.
========================================================= */

.counter {

    width: 100%;

    text-align: center;

    font-size: 104px;

    line-height: .92;

    font-weight: 950;

    letter-spacing: -5px;

    white-space: nowrap;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #ffd1ed 55%,
            #d768aa
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    transition:
        transform .2s ease;
}

.counter.bump {

    transform:
        scale(1.06);
}


/* =========================================================
   MILESTONE
========================================================= */

.goal {

    width: 100%;

    margin-top: 14px;
}

.goal-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 7px;
}

.goal-title {

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 1.5px;

    color:
        #b38aa3;
}

.goal-number {

    font-size: 14px;

    font-weight: 900;

    color:
        #ff9ed8;
}

.progress {

    width: 100%;

    height: 9px;

    overflow: hidden;

    border-radius: 999px;

    background:
        rgba(255, 255, 255, .07);
}

.progress-bar {

    width: 0%;

    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #b00072,
            #ff1493,
            #ff76c8
        );

    box-shadow:
        0 0 14px
        rgba(255, 20, 160, .65);

    transition:
        width .7s ease;
}

.goal-footer {

    display: flex;

    justify-content: space-between;

    margin-top: 7px;

    font-size: 10px;

    color:
        #91657e;
}


/* =========================================================
   RIGHT SIDE
========================================================= */

.right {

    display: flex;

    flex-direction: column;

    min-width: 0;
}


/* =========================================================
   GREETING
========================================================= */

.greeting {

    height: 37px;

    flex-shrink: 0;

    font-size: 22px;

    font-weight: 850;

    color:
        #ffc1e8;

    text-shadow:
        0 0 20px
        rgba(255, 50, 180, .3);
}


/* =========================================================
   CLOCK

   ONLY HOUR + MINUTE
========================================================= */

.clock-box {

    height: 78px;

    flex-shrink: 0;

    padding:
        10px 18px;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 70, 185, .09),
            rgba(255, 255, 255, .012)
        );

    border:
        1px solid
        rgba(255, 100, 200, .15);
}

.clock-title {

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 2px;

    color:
        #b184a0;
}

.clock {

    margin-top: 1px;

    font-size: 37px;

    line-height: 1;

    font-weight: 900;

    letter-spacing: -1px;

    background:
        linear-gradient(
            90deg,
            white,
            #ff9ed8
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}


/* =========================================================
   CHANNEL DATA
========================================================= */

.data-box {

    position: relative;

    flex: 1;

    min-height: 0;

    margin-top: 14px;

    padding: 20px;

    overflow: hidden;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 60, 180, .08),
            rgba(255, 255, 255, .012)
        );

    border:
        1px solid
        rgba(255, 100, 200, .15);
}

.data-title {

    position: absolute;

    top: 13px;
    left: 20px;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 2px;

    color:
        #b1839e;
}


/* =========================================================
   SLIDES
========================================================= */

.slide {

    position: absolute;

    left: 20px;
    right: 20px;

    top: 38px;
    bottom: 27px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    opacity: 1;

    transform:
        translateY(0);

    transition:
        opacity .4s ease,
        transform .4s ease;
}

.slide.fade {

    opacity: 0;

    transform:
        translateY(10px);
}

.slide-title {

    margin-bottom: 9px;

    font-size: 15px;

    text-transform: uppercase;

    letter-spacing: 2px;

    color:
        #ff8ed0;

    font-weight: 800;
}

.big-value {

    font-size: 54px;

    line-height: 1;

    font-weight: 900;

    background:
        linear-gradient(
            90deg,
            white,
            #ff9ed8
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.small-info {

    margin-top: 8px;

    font-size: 14px;

    color:
        #b789a5;
}


/* =========================================================
   MINI PROGRESS
========================================================= */

.mini-goal {

    width: 280px;

    margin-top: 15px;
}

.mini-row {

    display: flex;

    justify-content: space-between;

    margin-bottom: 6px;

    font-size: 11px;

    color:
        #ae819d;
}

.mini-progress {

    height: 8px;

    overflow: hidden;

    border-radius: 999px;

    background:
        rgba(255, 255, 255, .07);
}

.mini-bar {

    width: 0%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #b00072,
            #ff1493,
            #ff76c8
        );

    transition:
        width .7s ease;
}


/* =========================================================
   MOTIVATIONAL MESSAGE
========================================================= */

.message-icon {

    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    font-size: 44px;

    line-height: 1;

    margin:
        0 0 12px;

    filter:
        drop-shadow(
            0 0 15px
            rgba(255, 50, 180, .45)
        );
}

.message {

    width: 100%;

    max-width: 450px;

    text-align: center;

    font-size: 23px;

    line-height: 1.3;

    font-weight: 850;

    color:
        #ffd6ef;
}

.message-sub {

    width: 100%;

    text-align: center;

    margin-top: 9px;

    font-size: 12px;

    color:
        #a2738e;
}


/* =========================================================
   DOTS
========================================================= */

.dots {

    position: absolute;

    bottom: 9px;
    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 6px;
}

.dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background:
        rgba(255, 120, 210, .25);

    transition:
        all .3s ease;
}

.dot.active {

    width: 19px;

    border-radius: 999px;

    background:
        #ff4db8;

    box-shadow:
        0 0 9px
        rgba(255, 50, 180, .6);
}


/* =========================================================
   STATUS
========================================================= */

.status {

    height: 14px;

    flex-shrink: 0;

    margin-top: 5px;

    text-align: right;

    font-size: 8px;

    color:
        #765469;
}

</style>
</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="background">

    <div class="light one"></div>
    <div class="light two"></div>
    <div class="light three"></div>

    <div class="grid"></div>

    <div class="shape one"></div>
    <div class="shape two"></div>
    <div class="shape three"></div>
    <div class="shape four"></div>

    <div class="trail one"></div>
    <div class="trail two"></div>

    <div
        class="particles"
        id="particles">
    </div>

</div>


<!-- =======================================================
     DASHBOARD
======================================================= -->

<div class="dashboard">


    <!-- ===================================================
         LEFT
    =================================================== -->

    <div class="left">


        <!-- PROFILE -->

        <div class="profile">

            <div class="pfp-wrapper">

                <div class="pfp-glow"></div>

                <img
                    class="pfp"
                    src="https://yt3.ggpht.com/ttAkTpY31wkOGnatdL3SG8reM98rZ2wVuG950Yno4ZCO9MMH1oyeIpT9ldBO-8KzAws6qeNT=s176-c-k-c0x00ffffff-no-rj"
                    alt="GuiTakeya"
                >

            </div>


            <div class="profile-info">

                <div class="channel-name">
                    GuiTakeya
                </div>

                <div class="handle">
                    @GuiTakeya
                </div>

            </div>

        </div>


        <!-- SUBSCRIBER -->

        <div class="subscriber-box">


            <!-- LIVE -->

            <div class="live">

                <span class="live-dot"></span>

                LIVE

            </div>


            <div class="counter-label">
                Subscribers
            </div>


            <div
                class="counter"
                id="subCount">
                —
            </div>


            <div class="goal">

                <div class="goal-header">

                    <div class="goal-title">
                        Next milestone
                    </div>

                    <div
                        class="goal-number"
                        id="goalText">
                        100
                    </div>

                </div>


                <div class="progress">

                    <div
                        class="progress-bar"
                        id="progressBar">
                    </div>

                </div>


                <div class="goal-footer">

                    <span id="goalProgress">
                        — / 100
                    </span>

                    <span>
                        Keep going! ♡
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- ===================================================
         RIGHT
    =================================================== -->

    <div class="right">


        <!-- GREETING -->

        <div
            class="greeting"
            id="greeting">
            Hello, Takeya! 💗
        </div>


        <!-- CLOCK -->

        <div class="clock-box">

            <div class="clock-title">
                Current Time
            </div>

            <div
                class="clock"
                id="clock">
                12:00 AM
            </div>

        </div>


        <!-- CHANNEL DATA -->

        <div class="data-box">

            <div class="data-title">
                Channel Data
            </div>


            <div
                class="slide"
                id="slide">

                <div
                    class="slide-title"
                    id="slideTitle">
                    Subscribers
                </div>

                <div
                    class="big-value"
                    id="bigValue">
                    —
                </div>

                <div
                    class="small-info"
                    id="smallInfo">
                    Loading...
                </div>

                <div id="extra"></div>

            </div>


            <div
                class="dots"
                id="dots">
            </div>

        </div>


        <div
            class="status"
            id="status">
            Connecting...
        </div>

    </div>

</div>


<!-- =======================================================
     SILK KEEP-ALIVE
======================================================= -->

<script src="https://dagammla.gitlab.io/keep-silk-open/keep.js"></script>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
    "https://api.socialcounts.org/youtube-live-subscriber-count/UChg7UoXV1HEtoUgwu0y871w";

const UPDATE_INTERVAL =
    30000;

const SLIDE_INTERVAL =
    6000;


/* =========================================================
   ELEMENTS
========================================================= */

const subCount =
    document.getElementById("subCount");

const goalText =
    document.getElementById("goalText");

const progressBar =
    document.getElementById("progressBar");

const goalProgress =
    document.getElementById("goalProgress");

const greeting =
    document.getElementById("greeting");

const clock =
    document.getElementById("clock");

const slide =
    document.getElementById("slide");

const slideTitle =
    document.getElementById("slideTitle");

const bigValue =
    document.getElementById("bigValue");

const smallInfo =
    document.getElementById("smallInfo");

const extra =
    document.getElementById("extra");

const dots =
    document.getElementById("dots");

const status =
    document.getElementById("status");


/* =========================================================
   DATA
========================================================= */

let subscriberCount = 0;
let viewCount = 0;
let videoCount = 0;

let previousSubscriberCount = null;

let slideIndex = 0;


/* =========================================================
   PARTICLES

   Generated inside the actual 960x480 viewport.
========================================================= */

const particleContainer =
    document.getElementById("particles");

for (
    let i = 0;
    i < 28;
    i++
) {

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.top =
        (45 + Math.random() * 55) + "%";

    particle.style.setProperty(
        "--duration",
        (8 + Math.random() * 12) + "s"
    );

    particle.style.setProperty(
        "--delay",
        (-Math.random() * 15) + "s"
    );

    particle.style.setProperty(
        "--x",
        ((Math.random() - .5) * 140) + "px"
    );

    particleContainer.appendChild(
        particle
    );
}


/* =========================================================
   CLOCK

   ONLY HOUR + MINUTE.
========================================================= */

function updateClock() {

    const now =
        new Date();


    clock.innerText =
        now.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );


    const hour =
        now.getHours();


    if (
        hour >= 5 &&
        hour < 12
    ) {

        greeting.innerText =
            "Good Morning, Takeya! ☀️";

    }

    else if (
        hour >= 12 &&
        hour < 18
    ) {

        greeting.innerText =
            "Good Afternoon, Takeya! 🌸";

    }

    else {

        greeting.innerText =
            "Good Night, Takeya! 🌙";
    }
}


updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================
   FETCH CHANNEL DATA
========================================================= */

async function fetchChannelData() {

    try {

        const response =
            await fetch(
                API_URL,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        const stats =
            data?.counters?.api ??
            data?.counters?.estimation;


        if (!stats) {

            throw new Error(
                "SocialCounts data missing"
            );
        }


        subscriberCount =
            Number(
                stats.subscriberCount
            );


        viewCount =
            Number(
                stats.viewCount
            );


        videoCount =
            Number(
                stats.videoCount
            );


        updateSubscriber();


        status.innerText =
            "● Live • Updated " +
            new Date()
                .toLocaleTimeString(
                    [],
                    {
                        hour: "numeric",
                        minute: "2-digit"
                    }
                );


    }

    catch (error) {

        console.error(
            "SocialCounts error:",
            error
        );


        status.innerText =
            "Connection issue • Retrying...";
    }
}


/* =========================================================
   SUBSCRIBER DISPLAY
========================================================= */

function updateSubscriber() {

    if (
        previousSubscriberCount !== null &&
        previousSubscriberCount !==
        subscriberCount
    ) {

        subCount.classList.add(
            "bump"
        );


        setTimeout(
            () => {

                subCount.classList.remove(
                    "bump"
                );

            },
            250
        );
    }


    previousSubscriberCount =
        subscriberCount;


    subCount.innerText =
        subscriberCount.toLocaleString();


    const milestoneBase =
        Math.floor(
            subscriberCount / 100
        ) * 100;


    let nextMilestone =
        milestoneBase + 100;


    if (
        subscriberCount % 100 === 0
    ) {

        nextMilestone =
            subscriberCount + 100;
    }


    const progress =
        (
            (
                subscriberCount -
                milestoneBase
            ) / 100
        ) * 100;


    goalText.innerText =
        nextMilestone.toLocaleString();


    progressBar.style.width =
        Math.max(
            0,
            Math.min(
                100,
                progress
            )
        ) + "%";


    goalProgress.innerText =
        subscriberCount.toLocaleString() +
        " / " +
        nextMilestone.toLocaleString();
}


/* =========================================================
   MOTIVATIONAL MESSAGES
========================================================= */

const messages = [

    [
        "💗",
        "Keep going, Takeya!",
        "Every subscriber gets you closer."
    ],

    [
        "🔥",
        "You're doing great!",
        "Don't stop now."
    ],

    [
        "🚀",
        "Next stop: 100K!",
        "One subscriber at a time."
    ],

    [
        "🌸",
        "Keep creating!",
        "Your channel is growing."
    ],

    [
        "⭐",
        "You've got this!",
        "Keep pushing forward."
    ],

    [
        "💖",
        "76 → 100 → 1,000...",
        "Imagine where this goes."
    ]

];


/* =========================================================
   DOTS
========================================================= */

for (
    let i = 0;
    i < 4;
    i++
) {

    const dot =
        document.createElement("div");

    dot.className =
        "dot";


    if (i === 0) {

        dot.classList.add(
            "active"
        );
    }


    dots.appendChild(
        dot
    );
}


/* =========================================================
   SLIDES
========================================================= */

function renderSlide() {

    slide.classList.add(
        "fade"
    );


    setTimeout(
        () => {


            /* ---------------------------------------------
               SUBSCRIBERS
            --------------------------------------------- */

            if (
                slideIndex === 0
            ) {

                const previous =
                    Math.floor(
                        subscriberCount / 100
                    ) * 100;


                const next =
                    previous + 100;


                const progress =
                    (
                        (
                            subscriberCount -
                            previous
                        ) / 100
                    ) * 100;


                slideTitle.innerText =
                    "👥 Subscribers";


                bigValue.innerText =
                    subscriberCount
                        .toLocaleString();


                smallInfo.innerText =
                    "Next milestone: " +
                    next.toLocaleString();


                extra.innerHTML = `

                    <div class="mini-goal">

                        <div class="mini-row">

                            <span>
                                Progress
                            </span>

                            <span>
                                ${Math.max(
                                    0,
                                    Math.min(
                                        100,
                                        progress
                                    )
                                ).toFixed(0)}%
                            </span>

                        </div>


                        <div class="mini-progress">

                            <div
                                class="mini-bar"
                                style="
                                    width:
                                    ${Math.max(
                                        0,
                                        Math.min(
                                            100,
                                            progress
                                        )
                                    )}%
                                "
                            ></div>

                        </div>

                    </div>

                `;
            }


            /* ---------------------------------------------
               VIEWS
            --------------------------------------------- */

            else if (
                slideIndex === 1
            ) {

                slideTitle.innerText =
                    "👀 Total Views";


                bigValue.innerText =
                    viewCount.toLocaleString();


                smallInfo.innerText =
                    "Total channel views";


                extra.innerHTML = `

                    <div class="message-sub">
                        Every view counts. 💗
                    </div>

                `;
            }


            /* ---------------------------------------------
               VIDEOS
            --------------------------------------------- */

            else if (
                slideIndex === 2
            ) {

                slideTitle.innerText =
                    "🎬 Videos";


                bigValue.innerText =
                    videoCount.toLocaleString();


                smallInfo.innerText =
                    "Videos uploaded";


                extra.innerHTML = `

                    <div class="message-sub">
                        Keep the uploads coming!
                    </div>

                `;
            }


            /* ---------------------------------------------
               MESSAGE
            --------------------------------------------- */

            else {

                const message =
                    messages[
                        Math.floor(
                            Math.random() *
                            messages.length
                        )
                    ];


                slideTitle.innerText =
                    "💌 A Little Message";


                bigValue.innerHTML =
                    "";


                smallInfo.innerHTML =
                    "";


                extra.innerHTML = `

                    <div class="message-icon">
                        ${message[0]}
                    </div>

                    <div class="message">
                        ${message[1]}
                    </div>

                    <div class="message-sub">
                        ${message[2]}
                    </div>

                `;
            }


            /* ---------------------------------------------
               DOTS
            --------------------------------------------- */

            for (
                let i = 0;
                i < dots.children.length;
                i++
            ) {

                dots.children[i]
                    .classList
                    .toggle(
                        "active",
                        i === slideIndex
                    );
            }


            slide.classList.remove(
                "fade"
            );

        },

        400
    );
}


/* =========================================================
   ROTATE SLIDES
========================================================= */

setInterval(
    () => {

        slideIndex =
            (
                slideIndex + 1
            ) % 4;

        renderSlide();

    },

    SLIDE_INTERVAL
);


/* =========================================================
   START
========================================================= */

fetchChannelData();

setInterval(
    fetchChannelData,
    UPDATE_INTERVAL
);

renderSlide();

</script>

</body>
</html>
