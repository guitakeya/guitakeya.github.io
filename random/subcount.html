<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GuiTakeya Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(255, 20, 147, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(255, 0, 200, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 50% 50%,
                    rgba(190, 0, 255, 0.15),
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    #080308,
                    #180812,
                    #100512,
                    #050305
                );

            background-size: 200% 200%;

            animation:
                backgroundMove 15s ease infinite;
        }


        /* =====================================================
           ANIMATED BACKGROUND
        ===================================================== */

        @keyframes backgroundMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .orb {
            position: absolute;

            border-radius: 50%;

            filter: blur(90px);

            opacity: 0.4;

            mix-blend-mode: screen;
        }


        .orb.one {
            width: 380px;
            height: 380px;

            left: -120px;
            top: 5%;

            background:
                rgba(255, 0, 140, 0.55);

            animation:
                orbOne 20s ease-in-out infinite;
        }


        .orb.two {
            width: 320px;
            height: 320px;

            right: -100px;
            bottom: 0;

            background:
                rgba(200, 0, 255, 0.45);

            animation:
                orbTwo 23s ease-in-out infinite;
        }


        .orb.three {
            width: 260px;
            height: 260px;

            left: 45%;
            top: -130px;

            background:
                rgba(255, 60, 190, 0.35);

            animation:
                orbThree 28s ease-in-out infinite;
        }


        @keyframes orbOne {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(220px, 130px, 0)
                    scale(1.3);
            }

        }


        @keyframes orbTwo {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(-180px, -120px, 0)
                    scale(1.25);
            }

        }


        @keyframes orbThree {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0);
            }

            50% {
                transform:
                    translate3d(-100px, 180px, 0);
            }

        }


        /* =====================================================
           FLOATING GLASS SHAPES
        ===================================================== */

        .shape {
            position: absolute;

            border:
                1px solid
                rgba(255, 150, 220, 0.10);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 120, 200, 0.07),
                    rgba(255, 255, 255, 0.01)
                );

            backdrop-filter:
                blur(12px);

            opacity: 0.45;
        }


        .shape.one {
            width: 180px;
            height: 180px;

            left: 4%;
            top: 10%;

            border-radius: 40px;

            animation:
                shapeOne 18s ease-in-out infinite;
        }


        .shape.two {
            width: 130px;
            height: 130px;

            right: 7%;
            top: 12%;

            border-radius: 50%;

            animation:
                shapeTwo 15s ease-in-out infinite;
        }


        .shape.three {
            width: 210px;
            height: 210px;

            right: 22%;
            bottom: -90px;

            border-radius: 45px;

            animation:
                shapeThree 22s ease-in-out infinite;
        }


        .shape.four {
            width: 100px;
            height: 100px;

            left: 18%;
            bottom: 8%;

            border-radius: 25px;

            animation:
                shapeFour 17s ease-in-out infinite;
        }


        @keyframes shapeOne {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(25deg);
            }

            50% {
                transform:
                    translate3d(100px, 70px, 0)
                    rotate(145deg);
            }

        }


        @keyframes shapeTwo {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(-90px, 100px, 0)
                    scale(1.4);
            }

        }


        @keyframes shapeThree {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(45deg);
            }

            50% {
                transform:
                    translate3d(-110px, -120px, 0)
                    rotate(150deg);
            }

        }


        @keyframes shapeFour {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(20deg);
            }

            50% {
                transform:
                    translate3d(70px, -70px, 0)
                    rotate(150deg);
            }

        }


        /* =====================================================
           DASHBOARD
        ===================================================== */

        .dashboard {
            position: relative;

            z-index: 10;

            width:
                min(92vw, 950px);

            height:
                min(88vh, 620px);

            padding:
                32px;

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                28px;

            background:
                linear-gradient(
                    135deg,
                    rgba(35, 12, 30, 0.86),
                    rgba(12, 5, 12, 0.78)
                );

            border:
                1px solid
                rgba(255, 120, 210, 0.15);

            border-radius:
                32px;

            backdrop-filter:
                blur(30px);

            -webkit-backdrop-filter:
                blur(30px);

            box-shadow:

                0 30px 100px
                rgba(0, 0, 0, 0.70),

                0 0 90px
                rgba(255, 0, 170, 0.10),

                inset 0 1px 0
                rgba(255, 180, 230, 0.08);

            animation:
                dashboardAppear 0.8s ease-out;
        }


        @keyframes dashboardAppear {

            from {
                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =====================================================
           LEFT SIDE
        ===================================================== */

        .left {
            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;
        }


        .pfp-wrapper {
            position:
                relative;
        }


        .pfp-glow {
            position:
                absolute;

            inset:
                -25px;

            border-radius:
                50%;

            background:
                rgba(255, 0, 170, 0.30);

            filter:
                blur(30px);

            animation:
                pfpGlow 3s ease-in-out infinite;
        }


        @keyframes pfpGlow {

            0%, 100% {
                opacity: 0.45;
                transform: scale(0.95);
            }

            50% {
                opacity: 0.85;
                transform: scale(1.08);
            }

        }


        .pfp {
            position:
                relative;

            width:
                180px;

            height:
                180px;

            border-radius:
                50%;

            object-fit:
                cover;

            border:
                5px solid #ff4db8;

            box-shadow:

                0 0 0 8px
                rgba(255, 0, 170, 0.08),

                0 0 55px
                rgba(255, 0, 170, 0.45);
        }


        .channel-name {
            margin-top:
                18px;

            font-size:
                1.55rem;

            font-weight:
                800;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb6e6
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;
        }


        .handle {
            color:
                #a86d91;

            font-size:
                0.85rem;
        }


        /* =====================================================
           SUBSCRIBER BOX
        ===================================================== */

        .subscriber-box {
            width:
                100%;

            margin-top:
                20px;

            padding:
                18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 70, 180, 0.09),
                    rgba(255, 255, 255, 0.015)
                );

            border:
                1px solid
                rgba(255, 120, 210, 0.13);

            border-radius:
                20px;
        }


        .counter-label {
            color:
                #a86d91;

            font-size:
                0.7rem;

            text-transform:
                uppercase;

            letter-spacing:
                3px;
        }


        .counter {
            margin:
                5px 0;

            font-size:
                clamp(4rem, 7vw, 5.4rem);

            line-height:
                1;

            font-weight:
                850;

            letter-spacing:
                -5px;

            background:
                linear-gradient(
                    180deg,
                    #ffffff,
                    #ffd6ef,
                    #d66aaa
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;

            transition:
                transform 0.25s ease;
        }


        .counter.bump {
            transform:
                scale(1.08);

            filter:
                drop-shadow(
                    0 0 25px
                    rgba(255, 20, 170, 0.55)
                );
        }


        /* =====================================================
           LIVE
        ===================================================== */

        .live {
            display:
                inline-flex;

            align-items:
                center;

            gap:
                8px;

            padding:
                6px 12px;

            border-radius:
                999px;

            background:
                rgba(255, 0, 170, 0.10);

            border:
                1px solid
                rgba(255, 70, 190, 0.28);

            color:
                #ff70c8;

            font-size:
                0.68rem;

            font-weight:
                800;

            letter-spacing:
                1.5px;
        }


        .live-dot {
            width:
                8px;

            height:
                8px;

            border-radius:
                50%;

            background:
                #ff209d;

            box-shadow:
                0 0 12px #ff209d;

            animation:
                pulse 1.4s infinite;
        }


        @keyframes pulse {

            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }

        }


        /* =====================================================
           MILESTONE
        ===================================================== */

        .goal-box {
            margin-top:
                13px;

            padding:
                13px 15px;

            background:
                rgba(255, 255, 255, 0.025);

            border:
                1px solid
                rgba(255, 120, 210, 0.10);

            border-radius:
                14px;

            text-align:
                left;
        }


        .goal-header {
            display:
                flex;

            justify-content:
                space-between;

            margin-bottom:
                8px;
        }


        .goal-title {
            color:
                #c28aaa;

            font-size:
                0.68rem;

            text-transform:
                uppercase;

            letter-spacing:
                1.5px;
        }


        .goal-number {
            color:
                #ff9ed8;

            font-size:
                0.8rem;

            font-weight:
                700;
        }


        .progress {
            width:
                100%;

            height:
                7px;

            background:
                rgba(255, 255, 255, 0.06);

            border-radius:
                999px;

            overflow:
                hidden;
        }


        .progress-bar {
            height:
                100%;

            width:
                0%;

            background:
                linear-gradient(
                    90deg,
                    #c00078,
                    #ff1493,
                    #ff72c6
                );

            border-radius:
                inherit;

            box-shadow:
                0 0 18px
                rgba(255, 20, 160, 0.65);

            transition:
                width 0.8s ease;
        }


        .goal-footer {
            display:
                flex;

            justify-content:
                space-between;

            margin-top:
                7px;

            color:
                #76516a;

            font-size:
                0.62rem;
        }


        /* =====================================================
           RIGHT SIDE
        ===================================================== */

        .right {
            display:
                flex;

            flex-direction:
                column;

            gap:
                18px;

            min-width:
                0;
        }


        /* =====================================================
           GREETING
        ===================================================== */

        .greeting {
            font-size:
                1.15rem;

            font-weight:
                700;

            color:
                #ffb6e6;

            padding-left:
                4px;

            text-shadow:
                0 0 20px
                rgba(255, 70, 190, 0.20);
        }


        /* =====================================================
           CLOCK
        ===================================================== */

        .clock-box {
            min-height:
                105px;

            padding:
                18px 22px;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 80, 190, 0.10),
                    rgba(255, 255, 255, 0.018)
                );

            border:
                1px solid
                rgba(255, 120, 210, 0.14);

            border-radius:
                20px;
        }


        .clock-title {
            color:
                #a86d91;

            font-size:
                0.65rem;

            text-transform:
                uppercase;

            letter-spacing:
                2px;
        }


        .clock {
            margin-top:
                3px;

            font-size:
                clamp(2.2rem, 4vw, 3.2rem);

            font-weight:
                800;

            letter-spacing:
                -2px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #ff9ed8
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;
        }


        .date {
            color:
                #76516a;

            font-size:
                0.68rem;
        }


        /* =====================================================
           CHANNEL DATA
        ===================================================== */

        .data-box {
            position:
                relative;

            flex:
                1;

            min-height:
                280px;

            padding:
                28px;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 80, 190, 0.07),
                    rgba(255, 255, 255, 0.015)
                );

            border:
                1px solid
                rgba(255, 120, 210, 0.13);

            border-radius:
                20px;

            overflow:
                hidden;
        }


        .data-title {
            position:
                absolute;

            top:
                18px;

            left:
                22px;

            color:
                #a86d91;

            font-size:
                0.65rem;

            text-transform:
                uppercase;

            letter-spacing:
                2px;
        }


        .slide {
            position:
                absolute;

            inset:
                50px 25px 35px;

            opacity:
                1;

            transform:
                translateY(0);

            transition:
                opacity 0.45s ease,
                transform 0.45s ease;
        }


        .slide.fade {
            opacity:
                0;

            transform:
                translateY(12px);
        }


        .slide-title {
            text-align:
                center;

            color:
                #ff8dcc;

            font-size:
                0.75rem;

            text-transform:
                uppercase;

            letter-spacing:
                2px;

            margin-bottom:
                12px;
        }


        .big-value {
            text-align:
                center;

            font-size:
                2.3rem;

            font-weight:
                850;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #ff9ed8
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;
        }


        .small-info {
            text-align:
                center;

            margin-top:
                5px;

            color:
                #987088;

            font-size:
                0.75rem;
        }


        /* =====================================================
           SUBSCRIBER SLIDE
        ===================================================== */

        .mini-goal {
            margin:
                18px auto 0;

            max-width:
                280px;

            padding:
                12px 15px;

            background:
                rgba(255,255,255,0.025);

            border:
                1px solid
                rgba(255,120,210,0.10);

            border-radius:
                14px;
        }


        .mini-goal-row {
            display:
                flex;

            justify-content:
                space-between;

            color:
                #9a6d89;

            font-size:
                0.7rem;

            margin-bottom:
                7px;
        }


        .mini-progress {
            height:
                6px;

            background:
                rgba(255,255,255,0.06);

            border-radius:
                999px;

            overflow:
                hidden;
        }


        .mini-progress-bar {
            height:
                100%;

            width:
                0%;

            background:
                linear-gradient(
                    90deg,
                    #c00078,
                    #ff1493,
                    #ff72c6
                );

            transition:
                width 0.7s ease;
        }


        /* =====================================================
           GRAPH
        ===================================================== */

        .graph {
            width:
                100%;

            height:
                105px;

            margin-top:
                10px;
        }


        .graph svg {
            width:
                100%;

            height:
                100%;

            overflow:
                visible;
        }


        .graph-line {
            fill:
                none;

            stroke:
                #ff55b8;

            stroke-width:
                3;

            stroke-linecap:
                round;

            stroke-linejoin:
                round;

            filter:
                drop-shadow(
                    0 0 7px
                    rgba(255, 40, 180, 0.5)
                );
        }


        .graph-area {
            fill:
                url(#pinkGradient);

            opacity:
                0.22;
        }


        .graph-labels {
            display:
                flex;

            justify-content:
                space-between;

            margin-top:
                3px;

            color:
                #65485c;

            font-size:
                0.55rem;
        }


        /* =====================================================
           ANALYTICS
        ===================================================== */

        .analytics-grid {
            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                10px;

            margin-top:
                12px;
        }


        .analytics-card {
            padding:
                9px;

            border-radius:
                12px;

            background:
                rgba(255,255,255,0.025);

            border:
                1px solid
                rgba(255,120,210,0.08);

            text-align:
                center;
        }


        .analytics-number {
            font-size:
                1.15rem;

            font-weight:
                800;

            color:
                #ffb0df;
        }


        .analytics-label {
            color:
                #76566c;

            font-size:
                0.55rem;

            text-transform:
                uppercase;

            letter-spacing:
                1px;
        }


        /* =====================================================
           ENCOURAGEMENT
        ===================================================== */

        .encouragement-icon {
            text-align:
                center;

            font-size:
                3rem;

            margin-bottom:
                15px;

            filter:
                drop-shadow(
                    0 0 20px
                    rgba(255, 50, 180, 0.4)
                );
        }


        .encouragement {
            text-align:
                center;

            font-size:
                1.25rem;

            line-height:
                1.45;

            font-weight:
                700;

            color:
                #ffd6ef;
        }


        .encouragement-sub {
            text-align:
                center;

            margin-top:
                10px;

            color:
                #986d87;

            font-size:
                0.75rem;
        }


        /* =====================================================
           DOTS
        ===================================================== */

        .dots {
            position:
                absolute;

            bottom:
                13px;

            left:
                50%;

            transform:
                translateX(-50%);

            display:
                flex;

            gap:
                6px;
        }


        .dot {
            width:
                6px;

            height:
                6px;

            border-radius:
                50%;

            background:
                rgba(255,120,210,0.20);

            transition:
                all 0.3s ease;
        }


        .dot.active {
            width:
                18px;

            border-radius:
                999px;

            background:
                #ff4db8;

            box-shadow:
                0 0 10px
                rgba(255,50,180,0.60);
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            text-align:
                right;

            color:
                #76566c;

            font-size:
                0.6rem;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 750px) {

            body {
                overflow:
                    auto;
            }


            .dashboard {

                width:
                    94vw;

                height:
                    auto;

                min-height:
                    auto;

                grid-template-columns:
                    1fr;

                padding:
                    25px;

            }


            .right {
                min-height:
                    500px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background">

        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>

        <div class="shape one"></div>
        <div class="shape two"></div>
        <div class="shape three"></div>
        <div class="shape four"></div>

    </div>


    <!-- =====================================================
         DASHBOARD
    ====================================================== -->

    <div class="dashboard">


        <!-- =================================================
             LEFT
        ================================================== -->

        <div class="left">

            <div class="pfp-wrapper">

                <div class="pfp-glow"></div>

                <img
                    class="pfp"
                    src="https://yt3.ggpht.com/ttAkTpY31wkOGnatdL3SG8reM98rZ2wVuG950Yno4ZCO9MMH1oyeIpT9ldBO-8KzAws6qeNT=s176-c-k-c0x00ffffff-no-rj"
                    alt="GuiTakeya"
                >

            </div>


            <div class="channel-name">
                GuiTakeya
            </div>


            <div class="handle">
                @GuiTakeya
            </div>


            <div class="subscriber-box">

                <div class="counter-label">
                    Subscribers
                </div>


                <div
                    class="counter"
                    id="subCount"
                >
                    —
                </div>


                <div class="live">

                    <span class="live-dot"></span>

                    LIVE

                </div>


                <div class="goal-box">

                    <div class="goal-header">

                        <div class="goal-title">
                            Next milestone
                        </div>

                        <div
                            class="goal-number"
                            id="goalText"
                        >
                            100
                        </div>

                    </div>


                    <div class="progress">

                        <div
                            class="progress-bar"
                            id="progressBar"
                        ></div>

                    </div>


                    <div class="goal-footer">

                        <span id="currentGoalText">
                            — / 100
                        </span>

                        <span>
                            Keep going! ♡
                        </span>

                    </div>

                </div>

            </div>

        </div>


        <!-- =================================================
             RIGHT
        ================================================== -->

        <div class="right">


            <!-- GREETING -->

            <div
                class="greeting"
                id="greeting"
            >
                Hello, Takeya! 💗
            </div>


            <!-- CLOCK -->

            <div class="clock-box">

                <div class="clock-title">
                    Current Time
                </div>

                <div
                    class="clock"
                    id="clock"
                >
                    12:00:00 AM
                </div>

                <div
                    class="date"
                    id="date"
                >
                    Loading...
                </div>

            </div>


            <!-- CHANNEL DATA -->

            <div class="data-box">

                <div class="data-title">
                    Channel Data
                </div>


                <div
                    class="slide"
                    id="slide"
                >

                    <div
                        class="slide-title"
                        id="slideTitle"
                    >
                        Subscribers
                    </div>


                    <div
                        class="big-value"
                        id="bigValue"
                    >
                        —
                    </div>


                    <div
                        class="small-info"
                        id="smallInfo"
                    >
                        Loading...
                    </div>


                    <div
                        class="extra"
                        id="extra"
                    ></div>

                </div>


                <div
                    class="dots"
                    id="dots"
                ></div>

            </div>


            <div
                class="status"
                id="status"
            >
                Connecting...
            </div>

        </div>

    </div>


    <!-- =====================================================
         SILK KEEP-ALIVE
    ====================================================== -->

    <script src="https://dagammla.gitlab.io/keep-silk-open/keep.js"></script>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           CONFIG
        ===================================================== */

        const API_URL =
            "https://api.socialcounts.org/youtube-live-subscriber-count/UChg7UoXV1HEtoUgwu0y871w";


        const UPDATE_INTERVAL =
            30000;


        const SLIDE_INTERVAL =
            6000;


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const subCount =
            document.getElementById("subCount");

        const goalText =
            document.getElementById("goalText");

        const progressBar =
            document.getElementById("progressBar");

        const currentGoalText =
            document.getElementById("currentGoalText");

        const status =
            document.getElementById("status");

        const greeting =
            document.getElementById("greeting");

        const clock =
            document.getElementById("clock");

        const date =
            document.getElementById("date");

        const slide =
            document.getElementById("slide");

        const slideTitle =
            document.getElementById("slideTitle");

        const bigValue =
            document.getElementById("bigValue");

        const smallInfo =
            document.getElementById("smallInfo");

        const extra =
            document.getElementById("extra");

        const dots =
            document.getElementById("dots");


        /* =====================================================
           STATE
        ===================================================== */

        let currentCount =
            0;

        let previousCount =
            null;

        let currentViews =
            null;

        let slideIndex =
            0;


        /* =====================================================
           GREETING
        ===================================================== */

        function updateGreeting() {

            const hour =
                new Date().getHours();


            let text;


            if (
                hour >= 5 &&
                hour < 12
            ) {

                text =
                    "Good Morning, Takeya! ☀️";

            }

            else if (
                hour >= 12 &&
                hour < 18
            ) {

                text =
                    "Good Afternoon, Takeya! 🌸";

            }

            else {

                text =
                    "Good Night, Takeya! 🌙";

            }


            greeting.innerText =
                text;

        }


        /* =====================================================
           CLOCK
        ===================================================== */

        function updateClock() {

            const now =
                new Date();


            clock.innerText =
                now.toLocaleTimeString(
                    [],
                    {
                        hour:
                            "numeric",

                        minute:
                            "2-digit",

                        second:
                            "2-digit"
                    }
                );


            date.innerText =
                now.toLocaleDateString(
                    [],
                    {
                        weekday:
                            "long",

                        month:
                            "long",

                        day:
                            "numeric",

                        year:
                            "numeric"
                    }
                );


            updateGreeting();

        }


        updateClock();


        setInterval(
            updateClock,
            1000
        );


        /* =====================================================
           LOCAL STORAGE ANALYTICS
        ===================================================== */

        function getHistory() {

            try {

                return JSON.parse(
                    localStorage.getItem(
                        "guitakeya_history"
                    )
                ) || [];

            }

            catch {

                return [];

            }

        }


        function saveSnapshot(
            subscribers,
            views
        ) {

            const history =
                getHistory();


            const today =
                new Date()
                    .toISOString()
                    .split("T")[0];


            const existing =
                history.find(
                    item =>
                        item.date === today
                );


            if (existing) {

                existing.subscribers =
                    subscribers;

                if (
                    views !== null
                ) {

                    existing.views =
                        views;

                }

            }

            else {

                history.push({

                    date:
                        today,

                    subscribers:
                        subscribers,

                    views:
                        views

                });

            }


            /*
             * Keep only the last 30 days.
             */

            const trimmed =
                history.slice(-30);


            localStorage.setItem(
                "guitakeya_history",
                JSON.stringify(trimmed)
            );

        }


        /* =====================================================
           API
        ===================================================== */

        async function fetchSubCount() {

            try {

                const response =
                    await fetch(
                        API_URL,
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "SocialCounts:",
                    data
                );


                /*
                 * Try several possible
                 * SocialCounts structures.
                 */

                const count =
                    data?.counters?.api?.subscriberCount ??
                    data?.counters?.estimation?.subscriberCount ??
                    data?.subscriberCount ??
                    data?.subCount;


                if (
                    count === undefined ||
                    count === null
                ) {

                    throw new Error(
                        "Subscriber count not found."
                    );

                }


                const numericCount =
                    Number(count);


                updateCounter(
                    numericCount
                );


                /*
                 * Try to find views too.
                 */

                const views =
                    data?.counters?.api?.viewCount ??
                    data?.counters?.api?.views ??
                    data?.viewCount ??
                    data?.views;


                if (
                    views !== undefined &&
                    views !== null
                ) {

                    currentViews =
                        Number(views);

                }


                saveSnapshot(
                    numericCount,
                    currentViews
                );


                status.innerText =
                    "● Live • Updated " +
                    new Date()
                        .toLocaleTimeString();

            }


            catch (error) {

                console.error(
                    "API error:",
                    error
                );


                status.innerText =
                    "Unable to update • Retrying...";

            }

        }


        /* =====================================================
           COUNTER
        ===================================================== */

        function updateCounter(
            count
        ) {

            if (
                previousCount !== null &&
                previousCount !== count
            ) {

                subCount.classList.add(
                    "bump"
                );


                setTimeout(
                    () => {

                        subCount.classList.remove(
                            "bump"
                        );

                    },
                    250
                );

            }


            currentCount =
                count;


            previousCount =
                count;


            subCount.innerText =
                count.toLocaleString();


            /*
             * Milestone.
             */

            const goal =
                Math.ceil(
                    (count + 1) / 100
                ) * 100;


            const previousGoal =
                goal - 100;


            let progress =
                (
                    (count - previousGoal) /
                    100
                ) * 100;


            progress =
                Math.max(
                    0,
                    Math.min(
                        100,
                        progress
                    )
                );


            progressBar.style.width =
                progress + "%";


            goalText.innerText =
                goal.toLocaleString();


            currentGoalText.innerText =
                count.toLocaleString() +
                " / " +
                goal.toLocaleString();

        }


        /* =====================================================
           GRAPH DATA
        ===================================================== */

        function getLastSevenDays() {

            const history =
                getHistory();


            const result =
                [];


            for (
                let i = 6;
                i >= 0;
                i--
            ) {

                const date =
                    new Date();


                date.setDate(
                    date.getDate() - i
                );


                const key =
                    date
                        .toISOString()
                        .split("T")[0];


                const found =
                    history.find(
                        item =>
                            item.date === key
                    );


                result.push({

                    date:
                        key,

                    subscribers:
                        found
                            ?.subscribers ??
                        null,

                    views:
                        found
                            ?.views ??
                        null

                });

            }


            return result;

        }


        /* =====================================================
           GRAPH GENERATOR
        ===================================================== */

        function createGraph(
            values
        ) {

            const width =
                500;

            const height =
                105;

            const padding =
                8;


            const valid =
                values.filter(
                    value =>
                        value !== null &&
                        !isNaN(value)
                );


            if (
                valid.length < 2
            ) {

                return `
                    <svg
                        viewBox="0 0 500 105"
                        preserveAspectRatio="none"
                    >
                        <text
                            x="250"
                            y="58"
                            text-anchor="middle"
                            fill="#76566c"
                            font-size="12"
                        >
                            Collecting data...
                        </text>
                    </svg>
                `;

            }


            const min =
                Math.min(...valid);

            const max =
                Math.max(...valid);


            const range =
                max - min || 1;


            const points =
                values.map(
                    (value, index) => {

                        if (
                            value === null ||
                            isNaN(value)
                        ) {

                            return null;

                        }


                        const x =
                            padding +
                            (
                                index /
                                (values.length - 1)
                            ) *
                            (
                                width -
                                padding * 2
                            );


                        const y =
                            height -
                            padding -
                            (
                                (
                                    value - min
                                ) /
                                range
                            ) *
                            (
                                height -
                                padding * 2
                            );


                        return {
                            x,
                            y
                        };

                    }
                );


            const validPoints =
                points.filter(
                    point =>
                        point !== null
                );


            const line =
                validPoints
                    .map(
                        (
                            point,
                            index
                        ) =>
                            (
                                index === 0
                                    ? "M"
                                    : "L"
                            ) +
                            ` ${point.x} ${point.y}`
                    )
                    .join(" ");


            const first =
                validPoints[0];


            const last =
                validPoints[
                    validPoints.length - 1
                ];


            const area =
                line +
                ` L ${last.x} ${height} L ${first.x} ${height} Z`;


            return `
                <svg
                    viewBox="0 0 ${width} ${height}"
                    preserveAspectRatio="none"
                >

                    <defs>

                        <linearGradient
                            id="pinkGradient"
                            x1="0"
                            y1="0"
                            x2="0"
                            y2="1"
                        >

                            <stop
                                offset="0%"
                                stop-color="#ff4db8"
                                stop-opacity="0.8"
                            />

                            <stop
                                offset="100%"
                                stop-color="#ff4db8"
                                stop-opacity="0"
                            />

                        </linearGradient>

                    </defs>


                    <path
                        class="graph-area"
                        d="${area}"
                    ></path>


                    <path
                        class="graph-line"
                        d="${line}"
                    ></path>

                </svg>
            `;

        }


        /* =====================================================
           SLIDE CONTENT
        ===================================================== */

        const encouragingMessages = [

            [
                "💗",
                "Keep going, Takeya!",
                "Every subscriber gets you one step closer."
            ],

            [
                "🔥",
                "You're doing great!",
                "76 today. Who knows where you'll be tomorrow?"
            ],

            [
                "🌸",
                "Keep creating!",
                "Your channel is growing because you keep showing up."
            ],

            [
                "🚀",
                "Next stop: 100K!",
                "One subscriber at a time."
            ],

            [
                "⭐",
                "You've got this!",
                "Don't stop now."
            ],

            [
                "💖",
                "Someone out there is watching.",
                "Keep making things worth watching."
            ]

        ];


        function renderSlide() {

            slide.classList.add(
                "fade"
            );


            setTimeout(
                () => {

                    const history =
                        getLastSevenDays();


                    /*
                     * 0 = Subscribers
                     */

                    if (
                        slideIndex === 0
                    ) {

                        const goal =
                            Math.ceil(
                                (currentCount + 1) /
                                100
                            ) * 100;


                        const previousGoal =
                            goal - 100;


                        let progress =
                            (
                                (
                                    currentCount -
                                    previousGoal
                                ) / 100
                            ) * 100;


                        progress =
                            Math.max(
                                0,
                                Math.min(
                                    100,
                                    progress
                                )
                            );


                        slideTitle.innerText =
                            "👥 Subscribers";


                        bigValue.innerText =
                            currentCount
                                .toLocaleString();


                        smallInfo.innerText =
                            "Next milestone: " +
                            goal.toLocaleString();


                        extra.innerHTML = `

                            <div class="mini-goal">

                                <div class="mini-goal-row">

                                    <span>
                                        Progress
                                    </span>

                                    <span>
                                        ${progress.toFixed(1)}%
                                    </span>

                                </div>


                                <div class="mini-progress">

                                    <div
                                        class="mini-progress-bar"
                                        style="width:${progress}%"
                                    ></div>

                                </div>

                            </div>

                        `;

                    }


                    /*
                     * 1 = Views
                     */

                    else if (
                        slideIndex === 1
                    ) {

                        const views =
                            history.map(
                                day =>
                                    day.views
                            );


                        const first =
                            views.find(
                                value =>
                                    value !== null
                            );


                        const last =
                            [...views]
                                .reverse()
                                .find(
                                    value =>
                                        value !== null
                                );


                        let weeklyViews =
                            "—";


                        if (
                            first !== undefined &&
                            last !== undefined
                        ) {

                            weeklyViews =
                                Math.max(
                                    0,
                                    last - first
                                )
                                .toLocaleString();

                        }


                        slideTitle.innerText =
                            "👀 Views This Week";


                        bigValue.innerText =
                            weeklyViews;


                        smallInfo.innerText =
                            "7-day channel view activity";


                        extra.innerHTML = `

                            <div class="graph">

                                ${createGraph(
                                    views
                                )}

                            </div>


                            <div class="graph-labels">

                                <span>
                                    6 days ago
                                </span>

                                <span>
                                    Today
                                </span>

                            </div>

                        `;

                    }


                    /*
                     * 2 = Overall Analytics
                     */

                    else if (
                        slideIndex === 2
                    ) {

                        const subs =
                            history.map(
                                day =>
                                    day.subscribers
                            );


                        const views =
                            history.map(
                                day =>
                                    day.views
                            );


                        const firstSub =
                            subs.find(
                                value =>
                                    value !== null
                            );


                        const lastSub =
                            [...subs]
                                .reverse()
                                .find(
                                    value =>
                                        value !== null
                                );


                        const subGrowth =
                            firstSub !== undefined &&
                            lastSub !== undefined
                                ? lastSub - firstSub
                                : null;


                        const firstViews =
                            views.find(
                                value =>
                                    value !== null
                            );


                        const lastViews =
                            [...views]
                                .reverse()
                                .find(
                                    value =>
                                        value !== null
                                );


                        const viewGrowth =
                            firstViews !== undefined &&
                            lastViews !== undefined
                                ? Math.max(
                                    0,
                                    lastViews -
                                    firstViews
                                )
                                : null;


                        slideTitle.innerText =
                            "📊 Overall Analytics";


                        bigValue.innerText =
                            "This Week";


                        smallInfo.innerText =
                            "Channel growth over the last 7 days";


                        extra.innerHTML = `

                            <div class="analytics-grid">

                                <div class="analytics-card">

                                    <div class="analytics-number">

                                        ${
                                            subGrowth === null
                                                ? "—"
                                                : (
                                                    subGrowth >= 0
                                                        ? "+"
                                                        : ""
                                                ) +
                                                subGrowth
                                        }

                                    </div>

                                    <div class="analytics-label">
                                        Subscribers
                                    </div>

                                </div>


                                <div class="analytics-card">

                                    <div class="analytics-number">

                                        ${
                                            viewGrowth === null
                                                ? "—"
                                                : viewGrowth
                                                    .toLocaleString()
                                        }

                                    </div>

                                    <div class="analytics-label">
                                        Views
                                    </div>

                                </div>

                            </div>


                            <div class="graph">

                                ${createGraph(
                                    subs
                                )}

                            </div>

                            <div class="graph-labels">

                                <span>
                                    Subscriber trend
                                </span>

                                <span>
                                    7 days
                                </span>

                            </div>

                        `;

                    }


                    /*
                     * 3 = Encouragement
                     */

                    else {

                        const message =
                            encouragingMessages[
                                Math.floor(
                                    Math.random() *
                                    encouragingMessages.length
                                )
                            ];


                        slideTitle.innerText =
                            "💌 A Little Message";


                        bigValue.innerText =
                            "";


                        smallInfo.innerText =
                            "";


                        extra.innerHTML = `

                            <div class="encouragement-icon">
                                ${message[0]}
                            </div>


                            <div class="encouragement">
                                ${message[1]}
                            </div>


                            <div class="encouragement-sub">
                                ${message[2]}
                            </div>

                        `;

                    }


                    /*
                     * Activate correct dot.
                     */

                    const allDots =
                        dots.children;


                    for (
                        let i = 0;
                        i < allDots.length;
                        i++
                    ) {

                        allDots[i]
                            .classList
                            .toggle(
                                "active",
                                i === slideIndex
                            );

                    }


                    slide.classList.remove(
                        "fade"
                    );

                },
                450
            );

        }


        /* =====================================================
           SLIDE DOTS
        ===================================================== */

        for (
            let i = 0;
            i < 4;
            i++
        ) {

            const dot =
                document.createElement(
                    "div"
                );


            dot.className =
                "dot";


            if (
                i === 0
            ) {

                dot.classList.add(
                    "active"
                );

            }


            dots.appendChild(
                dot
            );

        }


        /* =====================================================
           ROTATE SLIDES
        ===================================================== */

        setInterval(
            () => {

                slideIndex =
                    (
                        slideIndex + 1
                    ) % 4;


                renderSlide();

            },
            SLIDE_INTERVAL
        );


        /* =====================================================
           START
        ===================================================== */

        fetchSubCount();


        setInterval(
            fetchSubCount,
            UPDATE_INTERVAL
        );


        renderSlide();

    </script>

</body>
