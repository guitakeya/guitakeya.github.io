<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960, height=480, initial-scale=1.0">
<title>GuiTakeya Live Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 960px;
    height: 480px;
    margin: 0;
    overflow: hidden;
}

body {
    position: relative;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 15% 20%, rgba(255, 0, 150, .22), transparent 30%),
        radial-gradient(circle at 85% 75%, rgba(180, 0, 255, .20), transparent 32%),
        linear-gradient(135deg, #080309, #170713 45%, #090309);
}

/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.light {
    position: absolute;
    border-radius: 50%;
}

.light.one {
    width: 330px;
    height: 330px;
    left: -100px;
    top: -90px;
    background: rgba(255, 0, 150, .22);
    filter: blur(70px);
    animation: lightOne 18s ease-in-out infinite;
}

.light.two {
    width: 300px;
    height: 300px;
    right: -80px;
    bottom: -80px;
    background: rgba(180, 0, 255, .22);
    filter: blur(65px);
    animation: lightTwo 22s ease-in-out infinite;
}

.light.three {
    width: 220px;
    height: 220px;
    left: 40%;
    top: -120px;
    background: rgba(255, 60, 190, .14);
    filter: blur(60px);
    animation: lightThree 25s ease-in-out infinite;
}

@keyframes lightOne {
    0%, 100% {
        transform: translate(0, 0) scale(1);
    }

    50% {
        transform: translate(190px, 100px) scale(1.35);
    }
}

@keyframes lightTwo {
    0%, 100% {
        transform: translate(0, 0) scale(1);
    }

    50% {
        transform: translate(-180px, -110px) scale(1.3);
    }
}

@keyframes lightThree {
    0%, 100% {
        transform: translate(0, 0);
    }

    50% {
        transform: translate(-90px, 160px);
    }
}

/* =========================
   GRID
========================= */

.grid {
    position: absolute;
    inset: -100px;
    opacity: .10;

    background-image:
        linear-gradient(
            rgba(255, 80, 190, .25) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255, 80, 190, .25) 1px,
            transparent 1px
        );

    background-size: 42px 42px;

    transform:
        perspective(350px)
        rotateX(58deg)
        translateY(120px);

    animation: gridMove 14s linear infinite;
}

@keyframes gridMove {
    from {
        background-position: 0 0;
    }

    to {
        background-position: 0 84px;
    }
}

/* =========================
   FLOATING SHAPES
========================= */

.shape {
    position: absolute;

    border: 1px solid rgba(255, 150, 220, .18);

    background:
        linear-gradient(
            135deg,
            rgba(255, 80, 190, .08),
            rgba(255,255,255,.015)
        );

    opacity: .55;
}

.shape.one {
    width: 120px;
    height: 120px;
    left: 25px;
    top: 35px;
    border-radius: 28px;

    transform: rotate(25deg);

    animation: shapeOne 16s ease-in-out infinite;
}

.shape.two {
    width: 85px;
    height: 85px;
    right: 35px;
    top: 55px;
    border-radius: 50%;

    animation: shapeTwo 14s ease-in-out infinite;
}

.shape.three {
    width: 145px;
    height: 145px;
    right: 210px;
    bottom: -75px;
    border-radius: 35px;

    transform: rotate(40deg);

    animation: shapeThree 20s ease-in-out infinite;
}

.shape.four {
    width: 65px;
    height: 65px;
    left: 250px;
    bottom: 20px;
    border-radius: 18px;

    animation: shapeFour 13s ease-in-out infinite;
}

@keyframes shapeOne {
    0%, 100% {
        transform: translate(0,0) rotate(25deg);
    }

    50% {
        transform: translate(70px,55px) rotate(130deg);
    }
}

@keyframes shapeTwo {
    0%, 100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(-65px,80px) scale(1.35);
    }
}

@keyframes shapeThree {
    0%, 100% {
        transform: translate(0,0) rotate(40deg);
    }

    50% {
        transform: translate(-90px,-80px) rotate(130deg);
    }
}

@keyframes shapeFour {
    0%, 100% {
        transform: translate(0,0) rotate(15deg);
    }

    50% {
        transform: translate(55px,-55px) rotate(120deg);
    }
}

/* =========================
   LIGHT TRAILS
========================= */

.trail {
    position: absolute;

    height: 2px;
    width: 300px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 80, 190, .65),
            transparent
        );

    opacity: .45;
}

.trail.one {
    top: 100px;
    left: -320px;
    transform: rotate(-12deg);

    animation: trailOne 11s linear infinite;
}

.trail.two {
    bottom: 100px;
    left: -350px;
    transform: rotate(8deg);

    animation: trailTwo 14s linear infinite;
}

@keyframes trailOne {
    from {
        left: -350px;
    }

    to {
        left: 1000px;
    }
}

@keyframes trailTwo {
    from {
        left: -400px;
    }

    to {
        left: 1050px;
    }
}

/* =========================
   PARTICLES
========================= */

.particles {
    position: absolute;
    inset: 0;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #ff8bd2;

    box-shadow:
        0 0 8px #ff3cac;

    animation:
        particleFloat
        var(--duration)
        linear
        infinite;

    animation-delay:
        var(--delay);

    opacity: .55;
}

@keyframes particleFloat {
    0% {
        transform:
            translate3d(0, 40px, 0);
        opacity: 0;
    }

    15% {
        opacity: .65;
    }

    85% {
        opacity: .65;
    }

    100% {
        transform:
            translate3d(
                var(--x),
                -500px,
                0
            );
        opacity: 0;
    }
}

/* =========================
   DASHBOARD
========================= */

.dashboard {
    position: absolute;

    left: 20px;
    top: 20px;

    width: 920px;
    height: 440px;

    display: grid;

    grid-template-columns:
        390px 1fr;

    gap: 22px;

    padding: 24px;

    border-radius: 28px;

    background:
        rgba(15, 6, 15, .82);

    border:
        1px solid
        rgba(255, 100, 200, .16);

    box-shadow:
        0 20px 70px rgba(0,0,0,.55),
        0 0 60px rgba(255,0,160,.07);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    z-index: 5;
}

/* =========================
   LEFT SIDE
========================= */

.left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.pfp-wrapper {
    position: relative;
}

.pfp-glow {
    position: absolute;
    inset: -18px;

    border-radius: 50%;

    background:
        rgba(255, 0, 160, .25);

    filter: blur(20px);

    animation: pfpPulse 3s ease-in-out infinite;
}

@keyframes pfpPulse {
    0%,100% {
        transform: scale(.94);
        opacity: .45;
    }

    50% {
        transform: scale(1.07);
        opacity: .8;
    }
}

.pfp {
    position: relative;

    width: 155px;
    height: 155px;

    object-fit: cover;

    border-radius: 50%;

    border:
        4px solid #ff4db8;

    box-shadow:
        0 0 0 7px rgba(255,0,160,.08),
        0 0 40px rgba(255,0,160,.45);
}

.channel-name {
    margin-top: 13px;

    font-size: 24px;
    font-weight: 800;

    background:
        linear-gradient(
            90deg,
            white,
            #ff9ed8
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.handle {
    color: #986b87;
    font-size: 12px;
}

/* =========================
   SUBSCRIBER BOX
========================= */

.subscriber-box {
    width: 100%;

    margin-top: 15px;

    padding: 14px;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(255,60,180,.09),
            rgba(255,255,255,.015)
        );

    border:
        1px solid
        rgba(255,100,200,.12);
}

.counter-label {
    text-align: center;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: 3px;

    color: #a87594;
}

.counter {
    text-align: center;

    margin: 2px 0 4px;

    font-size: 58px;

    line-height: 1;

    font-weight: 900;

    letter-spacing: -3px;

    background:
        linear-gradient(
            180deg,
            white,
            #ffd1ed,
            #d768aa
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    transition:
        transform .2s ease;
}

.counter.bump {
    transform: scale(1.07);
}

/* =========================
   LIVE INDICATOR
========================= */

.live {
    width: fit-content;

    margin: 0 auto 10px;

    display: flex;

    align-items: center;

    gap: 6px;

    padding: 4px 10px;

    border-radius: 999px;

    background:
        rgba(255,0,150,.09);

    border:
        1px solid
        rgba(255,80,190,.22);

    color: #ff72c5;

    font-size: 8px;

    font-weight: 800;

    letter-spacing: 1.5px;
}

.live-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ff219f;

    box-shadow:
        0 0 10px #ff219f;

    animation: pulse 1.3s infinite;
}

@keyframes pulse {
    50% {
        opacity: .3;
        transform: scale(.7);
    }
}

/* =========================
   MILESTONE
========================= */

.goal-header {
    display: flex;
    justify-content: space-between;

    margin-bottom: 6px;
}

.goal-title {
    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: 1.5px;

    color: #9a718b;
}

.goal-number {
    font-size: 10px;

    font-weight: 800;

    color: #ff9ed8;
}

.progress {
    width: 100%;
    height: 6px;

    overflow: hidden;

    border-radius: 999px;

    background:
        rgba(255,255,255,.06);
}

.progress-bar {
    width: 0%;
    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #b00072,
            #ff1493,
            #ff76c8
        );

    box-shadow:
        0 0 12px rgba(255,20,160,.65);

    transition:
        width .7s ease;
}

.goal-footer {
    display: flex;
    justify-content: space-between;

    margin-top: 5px;

    font-size: 8px;

    color: #704f65;
}

/* =========================
   RIGHT SIDE
========================= */

.right {
    display: flex;
    flex-direction: column;

    min-width: 0;
}

.greeting {
    height: 28px;

    font-size: 16px;
    font-weight: 750;

    color: #ffb4e3;

    text-shadow:
        0 0 20px rgba(255,50,180,.22);
}

.clock-box {
    height: 84px;

    padding: 13px 18px;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            rgba(255,70,185,.08),
            rgba(255,255,255,.012)
        );

    border:
        1px solid
        rgba(255,100,200,.12);
}

.clock-title {
    font-size: 8px;

    text-transform: uppercase;

    letter-spacing: 2px;

    color: #996b88;
}

.clock {
    margin-top: 1px;

    font-size: 31px;

    line-height: 1;

    font-weight: 850;

    letter-spacing: -1px;

    background:
        linear-gradient(
            90deg,
            white,
            #ff9ed8
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.date {
    margin-top: 4px;

    font-size: 9px;

    color: #705064;
}

/* =========================
   DATA BOX
========================= */

.data-box {
    position: relative;

    flex: 1;

    margin-top: 14px;

    padding: 20px;

    overflow: hidden;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(255,60,180,.07),
            rgba(255,255,255,.012)
        );

    border:
        1px solid
        rgba(255,100,200,.12);
}

.data-title {
    position: absolute;

    top: 12px;
    left: 17px;

    font-size: 8px;

    text-transform: uppercase;

    letter-spacing: 2px;

    color: #966984;
}

.slide {
    position: absolute;

    inset: 35px 20px 25px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    opacity: 1;

    transform: translateY(0);

    transition:
        opacity .4s ease,
        transform .4s ease;
}

.slide.fade {
    opacity: 0;

    transform: translateY(10px);
}

.slide-title {
    margin-bottom: 7px;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 2px;

    color: #ff86cc;
}

.big-value {
    font-size: 39px;

    line-height: 1;

    font-weight: 900;

    background:
        linear-gradient(
            90deg,
            white,
            #ff9ed8
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.small-info {
    margin-top: 6px;

    font-size: 10px;

    color: #8f637e;
}

.mini-goal {
    width: 230px;
    margin-top: 13px;
}

.mini-row {
    display: flex;
    justify-content: space-between;

    margin-bottom: 5px;

    font-size: 8px;

    color: #8c637d;
}

.mini-progress {
    height: 6px;

    overflow: hidden;

    border-radius: 999px;

    background:
        rgba(255,255,255,.06);
}

.mini-bar {
    width: 0%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #b00072,
            #ff1493,
            #ff76c8
        );

    transition:
        width .7s ease;
}

/* =========================
   MESSAGE
========================= */

.message-icon {
    font-size: 36px;

    margin-bottom: 8px;

    filter:
        drop-shadow(
            0 0 15px
            rgba(255,50,180,.4)
        );
}

.message {
    max-width: 420px;

    text-align: center;

    font-size: 17px;

    line-height: 1.35;

    font-weight: 750;

    color: #ffd6ef;
}

.message-sub {
    margin-top: 7px;

    text-align: center;

    font-size: 9px;

    color: #8e637e;
}

/* =========================
   DOTS
========================= */

.dots {
    position: absolute;

    bottom: 9px;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 5px;
}

.dot {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:
        rgba(255,120,210,.2);

    transition:
        all .3s ease;
}

.dot.active {
    width: 16px;

    border-radius: 999px;

    background: #ff4db8;

    box-shadow:
        0 0 9px
        rgba(255,50,180,.6);
}

/* =========================
   STATUS
========================= */

.status {
    height: 13px;

    margin-top: 5px;

    text-align: right;

    font-size: 7px;

    color: #65485a;
}
</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="background">

    <div class="light one"></div>
    <div class="light two"></div>
    <div class="light three"></div>

    <div class="grid"></div>

    <div class="shape one"></div>
    <div class="shape two"></div>
    <div class="shape three"></div>
    <div class="shape four"></div>

    <div class="trail one"></div>
    <div class="trail two"></div>

    <div class="particles" id="particles"></div>

</div>


<!-- DASHBOARD -->

<div class="dashboard">

    <!-- LEFT -->

    <div class="left">

        <div class="pfp-wrapper">

            <div class="pfp-glow"></div>

            <img
                class="pfp"
                src="https://yt3.ggpht.com/ttAkTpY31wkOGnatdL3SG8reM98rZ2wVuG950Yno4ZCO9MMH1oyeIpT9ldBO-8KzAws6qeNT=s176-c-k-c0x00ffffff-no-rj"
                alt="GuiTakeya"
            >

        </div>

        <div class="channel-name">
            GuiTakeya
        </div>

        <div class="handle">
            @GuiTakeya
        </div>

        <div class="subscriber-box">

            <div class="counter-label">
                Subscribers
            </div>

            <div
                class="counter"
                id="subCount"
            >
                —
            </div>

            <div class="live">
                <span class="live-dot"></span>
                LIVE
            </div>

            <div class="goal-header">

                <div class="goal-title">
                    Next milestone
                </div>

                <div
                    class="goal-number"
                    id="goalText"
                >
                    100
                </div>

            </div>

            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>

            <div class="goal-footer">

                <span id="goalProgress">
                    — / 100
                </span>

                <span>
                    Keep going! ♡
                </span>

            </div>

        </div>

    </div>


    <!-- RIGHT -->

    <div class="right">

        <div
            class="greeting"
            id="greeting"
        >
            Hello, Takeya! 💗
        </div>


        <div class="clock-box">

            <div class="clock-title">
                Current Time
            </div>

            <div
                class="clock"
                id="clock"
            >
                12:00:00 AM
            </div>

            <div
                class="date"
                id="date"
            >
                Loading...
            </div>

        </div>


        <div class="data-box">

            <div class="data-title">
                Channel Data
            </div>

            <div
                class="slide"
                id="slide"
            >

                <div
                    class="slide-title"
                    id="slideTitle"
                >
                    Subscribers
                </div>

                <div
                    class="big-value"
                    id="bigValue"
                >
                    —
                </div>

                <div
                    class="small-info"
                    id="smallInfo"
                >
                    Loading...
                </div>

                <div id="extra"></div>

            </div>


            <div
                class="dots"
                id="dots"
            ></div>

        </div>


        <div
            class="status"
            id="status"
        >
            Connecting...
        </div>

    </div>

</div>


<!-- SILK KEEP-ALIVE -->

<script src="https://dagammla.gitlab.io/keep-silk-open/keep.js"></script>


<script>

/* =========================
   CONFIG
========================= */

const API_URL =
    "https://api.socialcounts.org/youtube-live-subscriber-count/UChg7UoXV1HEtoUgwu0y871w";

const UPDATE_INTERVAL = 30000;
const SLIDE_INTERVAL = 6000;


/* =========================
   ELEMENTS
========================= */

const subCount =
    document.getElementById("subCount");

const goalText =
    document.getElementById("goalText");

const progressBar =
    document.getElementById("progressBar");

const goalProgress =
    document.getElementById("goalProgress");

const greeting =
    document.getElementById("greeting");

const clock =
    document.getElementById("clock");

const date =
    document.getElementById("date");

const slide =
    document.getElementById("slide");

const slideTitle =
    document.getElementById("slideTitle");

const bigValue =
    document.getElementById("bigValue");

const smallInfo =
    document.getElementById("smallInfo");

const extra =
    document.getElementById("extra");

const dots =
    document.getElementById("dots");

const status =
    document.getElementById("status");


/* =========================
   DATA
========================= */

let subscriberCount = 0;
let viewCount = 0;
let videoCount = 0;

let previousSubscriberCount = null;

let slideIndex = 0;


/* =========================
   PARTICLES
========================= */

const particleContainer =
    document.getElementById("particles");

for (let i = 0; i < 28; i++) {

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.top =
        (40 + Math.random() * 60) + "%";

    particle.style.setProperty(
        "--duration",
        (8 + Math.random() * 12) + "s"
    );

    particle.style.setProperty(
        "--delay",
        (-Math.random() * 15) + "s"
    );

    particle.style.setProperty(
        "--x",
        ((Math.random() - .5) * 180) + "px"
    );

    particleContainer.appendChild(
        particle
    );
}


/* =========================
   CLOCK
========================= */

function updateClock() {

    const now =
        new Date();

    clock.innerText =
        now.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit",
                second: "2-digit"
            }
        );

    date.innerText =
        now.toLocaleDateString(
            [],
            {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );

    const hour =
        now.getHours();

    if (hour >= 5 && hour < 12) {

        greeting.innerText =
            "Good Morning, Takeya! ☀️";

    } else if (hour >= 12 && hour < 18) {

        greeting.innerText =
            "Good Afternoon, Takeya! 🌸";

    } else {

        greeting.innerText =
            "Good Night, Takeya! 🌙";

    }
}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================
   FETCH DATA
========================= */

async function fetchChannelData() {

    try {

        const response =
            await fetch(
                API_URL,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }

        const data =
            await response.json();

        const stats =
            data?.counters?.api ??
            data?.counters?.estimation;

        if (!stats) {

            throw new Error(
                "SocialCounts data missing"
            );

        }

        subscriberCount =
            Number(
                stats.subscriberCount
            );

        viewCount =
            Number(
                stats.viewCount
            );

        videoCount =
            Number(
                stats.videoCount
            );

        updateSubscriber();

        status.innerText =
            "● Live • Updated " +
            new Date()
                .toLocaleTimeString();

    } catch (error) {

        console.error(
            "SocialCounts error:",
            error
        );

        status.innerText =
            "Connection issue • Retrying...";

    }
}


/* =========================
   SUBSCRIBER DISPLAY
========================= */

function updateSubscriber() {

    if (
        previousSubscriberCount !== null &&
        previousSubscriberCount !== subscriberCount
    ) {

        subCount.classList.add(
            "bump"
        );

        setTimeout(
            () => {
                subCount.classList.remove(
                    "bump"
                );
            },
            250
        );
    }

    previousSubscriberCount =
        subscriberCount;

    subCount.innerText =
        subscriberCount.toLocaleString();

    const previousMilestone =
        Math.floor(
            subscriberCount / 100
        ) * 100;

    let nextMilestone =
        previousMilestone + 100;

    if (
        subscriberCount % 100 === 0
    ) {

        nextMilestone =
            subscriberCount + 100;
    }

    const progress =
        (
            (
                subscriberCount -
                previousMilestone
            ) / 100
        ) * 100;

    goalText.innerText =
        nextMilestone.toLocaleString();

    progressBar.style.width =
        Math.max(
            0,
            Math.min(
                100,
                progress
            )
        ) + "%";

    goalProgress.innerText =
        subscriberCount.toLocaleString() +
        " / " +
        nextMilestone.toLocaleString();
}


/* =========================
   MESSAGES
========================= */

const messages = [

    [
        "💗",
        "Keep going, Takeya!",
        "Every subscriber gets you closer."
    ],

    [
        "🔥",
        "You're doing great!",
        "Don't stop now."
    ],

    [
        "🚀",
        "Next stop: 100K!",
        "One subscriber at a time."
    ],

    [
        "🌸",
        "Keep creating!",
        "Your channel is growing."
    ],

    [
        "⭐",
        "You've got this!",
        "Keep pushing forward."
    ],

    [
        "💖",
        "76 → 100 → 1,000...",
        "Imagine where this goes."
    ]

];


/* =========================
   SLIDE DOTS
========================= */

for (let i = 0; i < 4; i++) {

    const dot =
        document.createElement("div");

    dot.className =
        "dot";

    if (i === 0) {

        dot.classList.add(
            "active"
        );
    }

    dots.appendChild(dot);
}


/* =========================
   RENDER SLIDE
========================= */

function renderSlide() {

    slide.classList.add(
        "fade"
    );

    setTimeout(
        () => {

            /* SUBSCRIBERS */

            if (slideIndex === 0) {

                const previous =
                    Math.floor(
                        subscriberCount / 100
                    ) * 100;

                const next =
                    previous + 100;

                const progress =
                    (
                        (
                            subscriberCount -
                            previous
                        ) / 100
                    ) * 100;

                slideTitle.innerText =
                    "👥 Subscribers";

                bigValue.innerText =
                    subscriberCount
                        .toLocaleString();

                smallInfo.innerText =
                    "Next milestone: " +
                    next.toLocaleString();

                extra.innerHTML = `

                    <div class="mini-goal">

                        <div class="mini-row">

                            <span>
                                Progress
                            </span>

                            <span>
                                ${Math.max(
                                    0,
                                    Math.min(
                                        100,
                                        progress
                                    )
                                ).toFixed(0)}%
                            </span>

                        </div>

                        <div class="mini-progress">

                            <div
                                class="mini-bar"
                                style="
                                    width:
                                    ${Math.max(
                                        0,
                                        Math.min(
                                            100,
                                            progress
                                        )
                                    )}%
                                "
                            ></div>

                        </div>

                    </div>
                `;
            }

            /* VIEWS */

            else if (slideIndex === 1) {

                slideTitle.innerText =
                    "👀 Total Views";

                bigValue.innerText =
                    viewCount.toLocaleString();

                smallInfo.innerText =
                    "Total channel views";

                extra.innerHTML = `
                    <div class="message-sub">
                        Every view counts. 💗
                    </div>
                `;
            }

            /* VIDEOS */

            else if (slideIndex === 2) {

                slideTitle.innerText =
                    "🎬 Videos";

                bigValue.innerText =
                    videoCount.toLocaleString();

                smallInfo.innerText =
                    "Videos uploaded";

                extra.innerHTML = `
                    <div class="message-sub">
                        Keep the uploads coming!
                    </div>
                `;
            }

            /* MESSAGE */

            else {

                const message =
                    messages[
                        Math.floor(
                            Math.random() *
                            messages.length
                        )
                    ];

                slideTitle.innerText =
                    "💌 A Little Message";

                bigValue.innerHTML =
                    "";

                smallInfo.innerHTML =
                    "";

                extra.innerHTML = `

                    <div class="message-icon">
                        ${message[0]}
                    </div>

                    <div class="message">
                        ${message[1]}
                    </div>

                    <div class="message-sub">
                        ${message[2]}
                    </div>

                `;
            }


            /* UPDATE DOTS */

            for (
                let i = 0;
                i < dots.children.length;
                i++
            ) {

                dots.children[i]
                    .classList
                    .toggle(
                        "active",
                        i === slideIndex
                    );
            }

            slide.classList.remove(
                "fade"
            );

        },
        400
    );
}


/* =========================
   ROTATE SLIDES
========================= */

setInterval(
    () => {

        slideIndex =
            (
                slideIndex + 1
            ) % 4;

        renderSlide();

    },
    SLIDE_INTERVAL
);


/* =========================
   START
========================= */

fetchChannelData();

setInterval(
    fetchChannelData,
    UPDATE_INTERVAL
);

renderSlide();

</script>
