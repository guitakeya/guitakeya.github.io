<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>sub count</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            color: white;
            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 0, 0, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(130, 0, 255, 0.16),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #050505,
                    #100707,
                    #08050d,
                    #050505
                );

            background-size: 200% 200%;

            animation: backgroundMove 15s ease infinite;
        }

        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }


        /* =========================================================
           BACKGROUND 3D SHAPES
        ========================================================= */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }

        .orb {
            position: absolute;

            border-radius: 50%;

            filter: blur(70px);

            opacity: 0.45;

            mix-blend-mode: screen;
        }

        .orb.one {
            width: 320px;
            height: 320px;

            background: rgba(255, 0, 0, 0.55);

            left: -80px;
            top: 10%;

            animation:
                orbOne 18s ease-in-out infinite;
        }

        .orb.two {
            width: 280px;
            height: 280px;

            background: rgba(110, 0, 255, 0.45);

            right: -70px;
            bottom: 5%;

            animation:
                orbTwo 21s ease-in-out infinite;
        }

        .orb.three {
            width: 220px;
            height: 220px;

            background: rgba(255, 40, 100, 0.30);

            left: 55%;
            top: -100px;

            animation:
                orbThree 25s ease-in-out infinite;
        }

        @keyframes orbOne {
            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(180px, 130px, 0)
                    scale(1.3);
            }
        }

        @keyframes orbTwo {
            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(-180px, -100px, 0)
                    scale(1.25);
            }
        }

        @keyframes orbThree {
            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translate3d(-100px, 200px, 0)
                    rotate(180deg);
            }
        }


        /* Floating glass shapes */

        .shape {
            position: absolute;

            border: 1px solid rgba(255, 255, 255, 0.10);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.015)
                );

            backdrop-filter: blur(10px);

            box-shadow:
                inset 0 0 30px rgba(255, 255, 255, 0.025),
                0 0 50px rgba(255, 0, 0, 0.04);

            opacity: 0.55;
        }

        .shape.one {
            width: 170px;
            height: 170px;

            left: 5%;
            top: 12%;

            border-radius: 35px;

            transform: rotate(25deg);

            animation: shapeOne 17s ease-in-out infinite;
        }

        .shape.two {
            width: 120px;
            height: 120px;

            right: 8%;
            top: 15%;

            border-radius: 50%;

            animation: shapeTwo 13s ease-in-out infinite;
        }

        .shape.three {
            width: 200px;
            height: 200px;

            right: 20%;
            bottom: -80px;

            border-radius: 40px;

            transform: rotate(45deg);

            animation: shapeThree 20s ease-in-out infinite;
        }

        .shape.four {
            width: 90px;
            height: 90px;

            left: 20%;
            bottom: 10%;

            border-radius: 25px;

            transform: rotate(20deg);

            animation: shapeFour 15s ease-in-out infinite;
        }

        @keyframes shapeOne {
            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(25deg);
            }

            50% {
                transform:
                    translate3d(100px, 70px, 0)
                    rotate(145deg);
            }
        }

        @keyframes shapeTwo {
            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(-100px, 100px, 0)
                    scale(1.5);
            }
        }

        @keyframes shapeThree {
            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(45deg);
            }

            50% {
                transform:
                    translate3d(-120px, -120px, 0)
                    rotate(180deg);
            }
        }

        @keyframes shapeFour {
            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(20deg);
            }

            50% {
                transform:
                    translate3d(80px, -80px, 0)
                    rotate(160deg);
            }
        }


        /* =========================================================
           MAIN CARD
        ========================================================= */

        .container {
            position: relative;

            z-index: 10;

            width: min(90vw, 620px);

            padding: 45px 40px;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(30, 30, 30, 0.72),
                    rgba(12, 12, 12, 0.60)
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 30px;

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.70),
                inset 0 1px 0 rgba(255, 255, 255, 0.07);

            animation: cardAppear 0.8s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================================================
           PROFILE
        ========================================================= */

        .pfp-wrapper {
            position: relative;

            display: inline-block;

            margin-bottom: 18px;
        }

        .pfp-glow {
            position: absolute;

            inset: -12px;

            border-radius: 50%;

            background: rgba(255, 0, 0, 0.30);

            filter: blur(20px);

            animation: pfpGlow 2.5s ease-in-out infinite;
        }

        @keyframes pfpGlow {
            0%, 100% {
                opacity: 0.5;
                transform: scale(0.95);
            }

            50% {
                opacity: 0.9;
                transform: scale(1.08);
            }
        }

        .pfp {
            position: relative;

            width: 105px;
            height: 105px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid #ff2020;

            box-shadow:
                0 0 0 5px rgba(255, 0, 0, 0.10),
                0 0 35px rgba(255, 0, 0, 0.35);
        }

        h1 {
            margin: 0;

            font-size: 2.3rem;

            font-weight: 750;

            letter-spacing: -1px;
        }

        .handle {
            margin-top: 6px;

            color: #999;

            font-size: 1rem;
        }


        /* =========================================================
           LIVE BADGE
        ========================================================= */

        .live {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-top: 22px;

            padding: 7px 14px;

            border-radius: 999px;

            background:
                rgba(255, 0, 0, 0.10);

            border:
                1px solid
                rgba(255, 0, 0, 0.25);

            color: #ff4b4b;

            font-size: 0.75rem;

            font-weight: 800;

            letter-spacing: 1.5px;
        }

        .live-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #ff0000;

            box-shadow:
                0 0 10px #ff0000;

            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }


        /* =========================================================
           SUBSCRIBER COUNT
        ========================================================= */

        .counter {
            margin: 27px 0 5px;

            font-size:
                clamp(4rem, 12vw, 6rem);

            line-height: 1;

            font-weight: 800;

            letter-spacing: -4px;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #eeeeee 45%,
                    #999999 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            transition:
                transform 0.25s ease,
                filter 0.25s ease;
        }

        .counter.bump {
            transform: scale(1.08);

            filter:
                drop-shadow(
                    0 0 20px
                    rgba(255, 0, 0, 0.4)
                );
        }

        .label {
            color: #777;

            font-size: 0.8rem;

            text-transform: uppercase;

            letter-spacing: 4px;
        }


        /* =========================================================
           GOAL BOX
        ========================================================= */

        .goal-box {
            position: relative;

            margin-top: 32px;

            padding: 20px;

            text-align: left;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.055),
                    rgba(255, 255, 255, 0.018)
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.09);

            border-radius: 18px;

            box-shadow:
                inset 0 1px 0
                rgba(255, 255, 255, 0.04),
                0 10px 30px
                rgba(0, 0, 0, 0.25);

            overflow: hidden;
        }

        .goal-box::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 3px;

            background:
                linear-gradient(
                    180deg,
                    #ff0000,
                    #ff5555,
                    #aa0000
                );

            box-shadow:
                0 0 15px
                rgba(255, 0, 0, 0.6);
        }

        .goal-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 12px;
        }

        .goal-title {
            font-size: 0.85rem;

            font-weight: 700;

            color: #aaa;

            text-transform: uppercase;

            letter-spacing: 1.5px;
        }

        .goal-number {
            font-size: 0.9rem;

            font-weight: 700;

            color: #fff;
        }

        .progress {
            width: 100%;

            height: 9px;

            background:
                rgba(255, 255, 255, 0.07);

            border-radius: 999px;

            overflow: hidden;

            box-shadow:
                inset 0 1px 3px
                rgba(0, 0, 0, 0.5);
        }

        .progress-bar {
            height: 100%;

            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    #b50000,
                    #ff0000,
                    #ff5555
                );

            border-radius: inherit;

            box-shadow:
                0 0 15px
                rgba(255, 0, 0, 0.55);

            transition:
                width 0.8s cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );
        }

        .goal-footer {
            display: flex;

            justify-content: space-between;

            margin-top: 9px;

            font-size: 0.75rem;

            color: #666;
        }


        /* =========================================================
           STATUS
        ========================================================= */

        .status {
            margin-top: 22px;

            color: #555;

            font-size: 0.75rem;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 500px) {

            .container {
                width: 92vw;

                padding:
                    35px 22px;
            }

            .pfp {
                width: 85px;
                height: 85px;
            }

            h1 {
                font-size: 1.9rem;
            }

            .counter {
                letter-spacing: -2px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         ANIMATED BACKGROUND
    ========================================================== -->

    <div class="background">

        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>

        <div class="shape one"></div>
        <div class="shape two"></div>
        <div class="shape three"></div>
        <div class="shape four"></div>

    </div>


    <!-- =========================================================
         MAIN CONTENT
    ========================================================== -->

    <div class="container">

        <div class="pfp-wrapper">

            <div class="pfp-glow"></div>

            <img
                class="pfp"
                src="https://yt3.ggpht.com/ttAkTpY31wkOGnatdL3SG8reM98rZ2wVuG950Yno4ZCO9MMH1oyeIpT9ldBO-8KzAws6qeNT=s176-c-k-c0x00ffffff-no-rj"
                alt="GuiTakeya profile picture"
            >

        </div>


        <h1>
            GuiTakeya
        </h1>


        <div class="handle">
            @GuiTakeya
        </div>


        <div class="live">
            <span class="live-dot"></span>
            LIVE
        </div>


        <div
            class="counter"
            id="subCount"
        >
            —
        </div>


        <div class="label">
            Subscribers
        </div>


        <!-- =====================================================
             GOAL
        ====================================================== -->

        <div class="goal-box">

            <div class="goal-header">

                <div class="goal-title">
                    Next milestone
                </div>

                <div
                    class="goal-number"
                    id="goalText"
                >
                    100
                </div>

            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>


            <div class="goal-footer">

                <span id="currentGoalText">
                    0 / 100
                </span>

                <span>
                    Keep going!
                </span>

            </div>

        </div>


        <div
            class="status"
            id="status"
        >
            Connecting...
        </div>

    </div>


    <!-- =========================================================
         SILK / KEEP-SILK-OPEN
    ========================================================== -->

    <script src="https://dagammla.gitlab.io/keep-silk-open/keep.js"></script>


    <!-- =========================================================
         SUBSCRIBER COUNTER
    ========================================================== -->

    <script>

        const API_URL =
            "https://api.socialcounts.org/youtube-live-subscriber-count/UChg7UoXV1HEtoUgwu0y871w";


        const subCount =
            document.getElementById("subCount");

        const status =
            document.getElementById("status");

        const progressBar =
            document.getElementById("progressBar");

        const goalText =
            document.getElementById("goalText");

        const currentGoalText =
            document.getElementById("currentGoalText");


        let previousCount = null;


        async function fetchSubCount() {

            try {

                const response =
                    await fetch(
                        API_URL,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                /*
                 * SocialCounts API structure:
                 *
                 * data.counters.api.subscriberCount
                 *
                 * If that isn't available,
                 * use the estimation count.
                 */

                const count =
                    data?.counters?.api?.subscriberCount ??
                    data?.counters?.estimation?.subscriberCount;


                if (
                    typeof count !== "number"
                ) {

                    console.log(
                        "API response:",
                        data
                    );

                    throw new Error(
                        "Subscriber count not found."
                    );

                }


                updateCounter(count);


                status.innerText =
                    "● Live • Updated " +
                    new Date()
                        .toLocaleTimeString();

            }

            catch (error) {

                console.error(
                    "Error fetching subscriber count:",
                    error
                );


                status.innerText =
                    "Unable to update • Retrying...";

            }

        }


        function updateCounter(count) {

            /*
             * Animate the counter
             * when the number changes.
             */

            if (
                previousCount !== null &&
                previousCount !== count
            ) {

                subCount.classList.add(
                    "bump"
                );


                setTimeout(
                    () => {

                        subCount.classList.remove(
                            "bump"
                        );

                    },
                    250
                );

            }


            subCount.innerText =
                count.toLocaleString();


            previousCount =
                count;


            /*
             * Calculate next
             * 100-subscriber milestone.
             *
             * 76  -> 100
             * 100 -> 200
             * 194 -> 200
             * 237 -> 300
             */

            const goal =
                Math.ceil(
                    (count + 1) / 100
                ) * 100;


            const previousGoal =
                goal - 100;


            let progress =
                (
                    (count - previousGoal) /
                    (goal - previousGoal)
                ) * 100;


            progress =
                Math.min(
                    Math.max(progress, 0),
                    100
                );


            progressBar.style.width =
                progress + "%";


            goalText.innerText =
                goal.toLocaleString();


            currentGoalText.innerText =
                count.toLocaleString() +
                " / " +
                goal.toLocaleString();

        }


        /*
         * Fetch immediately when the page loads.
         */

        fetchSubCount();


        /*
         * Automatically update every 60 seconds.
         *
         * IMPORTANT:
         * This does NOT reload the page.
         *
         * It simply requests the latest number
         * from the API and replaces the number
         * already displayed on the page.
         */

        setInterval(
            fetchSubCount,
            60000
        );

    </script>

</body>
</html>
