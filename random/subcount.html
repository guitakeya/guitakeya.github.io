<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GuiTakeya — Live Subscriber Count</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            color: white;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 20, 147, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(255, 0, 180, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 50% 50%,
                    rgba(170, 0, 255, 0.12),
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    #080308,
                    #180812,
                    #100512,
                    #050305
                );

            background-size: 200% 200%;

            animation:
                backgroundMove 15s ease infinite;
        }


        /* =====================================================
           ANIMATED BACKGROUND
        ===================================================== */

        @keyframes backgroundMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        .background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;

        }


        /* Pink glowing orbs */

        .orb {

            position: absolute;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.45;

            mix-blend-mode: screen;

        }


        .orb.one {

            width: 350px;
            height: 350px;

            background:
                rgba(255, 0, 128, 0.55);

            left: -100px;
            top: 5%;

            animation:
                orbOne 18s ease-in-out infinite;

        }


        .orb.two {

            width: 300px;
            height: 300px;

            background:
                rgba(200, 0, 255, 0.45);

            right: -80px;
            bottom: 0;

            animation:
                orbTwo 21s ease-in-out infinite;

        }


        .orb.three {

            width: 240px;
            height: 240px;

            background:
                rgba(255, 60, 180, 0.35);

            left: 45%;
            top: -120px;

            animation:
                orbThree 25s ease-in-out infinite;

        }


        @keyframes orbOne {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(200px, 130px, 0)
                    scale(1.35);
            }

        }


        @keyframes orbTwo {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(-180px, -120px, 0)
                    scale(1.3);
            }

        }


        @keyframes orbThree {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translate3d(-120px, 200px, 0)
                    rotate(180deg);
            }

        }


        /* =====================================================
           FLOATING GLASS SHAPES
        ===================================================== */

        .shape {

            position: absolute;

            border:
                1px solid
                rgba(255, 150, 220, 0.12);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 120, 200, 0.08),
                    rgba(255, 255, 255, 0.015)
                );

            backdrop-filter: blur(10px);

            box-shadow:
                inset 0 0 30px
                rgba(255, 120, 220, 0.04),

                0 0 60px
                rgba(255, 0, 170, 0.06);

            opacity: 0.55;

        }


        .shape.one {

            width: 180px;
            height: 180px;

            left: 4%;
            top: 10%;

            border-radius: 40px;

            transform:
                rotate(25deg);

            animation:
                shapeOne 17s ease-in-out infinite;

        }


        .shape.two {

            width: 130px;
            height: 130px;

            right: 7%;
            top: 12%;

            border-radius: 50%;

            animation:
                shapeTwo 13s ease-in-out infinite;

        }


        .shape.three {

            width: 210px;
            height: 210px;

            right: 22%;
            bottom: -90px;

            border-radius: 45px;

            transform:
                rotate(45deg);

            animation:
                shapeThree 20s ease-in-out infinite;

        }


        .shape.four {

            width: 100px;
            height: 100px;

            left: 18%;
            bottom: 8%;

            border-radius: 25px;

            animation:
                shapeFour 15s ease-in-out infinite;

        }


        @keyframes shapeOne {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(25deg);
            }

            50% {
                transform:
                    translate3d(110px, 70px, 0)
                    rotate(145deg);
            }

        }


        @keyframes shapeTwo {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(-110px, 110px, 0)
                    scale(1.5);
            }

        }


        @keyframes shapeThree {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(45deg);
            }

            50% {
                transform:
                    translate3d(-120px, -130px, 0)
                    rotate(180deg);
            }

        }


        @keyframes shapeFour {

            0%, 100% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(20deg);
            }

            50% {
                transform:
                    translate3d(80px, -80px, 0)
                    rotate(160deg);
            }

        }


        /* =====================================================
           YUKI CHARACTER
        ===================================================== */

        .character {

            position: fixed;

            z-index: 4;

            right: -20px;
            bottom: -45px;

            width: min(32vw, 430px);

            max-height: 90vh;

            object-fit: contain;

            pointer-events: none;

            user-select: none;

            filter:
                drop-shadow(
                    0 0 25px
                    rgba(255, 20, 170, 0.45)
                );

            animation:
                characterFloat 4s ease-in-out infinite;

            transform-origin:
                bottom center;

        }


        @keyframes characterFloat {

            0%, 100% {

                transform:
                    translateY(0px)
                    rotate(0deg);

            }

            50% {

                transform:
                    translateY(-12px)
                    rotate(1deg);

            }

        }


        /* Pink aura behind character */

        .character-glow {

            position: fixed;

            z-index: 2;

            right: 3%;

            bottom: 8%;

            width: 330px;
            height: 500px;

            background:
                radial-gradient(
                    ellipse,
                    rgba(255, 20, 180, 0.28),
                    rgba(255, 0, 140, 0.08),
                    transparent 70%
                );

            filter: blur(50px);

            pointer-events: none;

            animation:
                characterGlow 4s ease-in-out infinite;

        }


        @keyframes characterGlow {

            0%, 100% {
                transform:
                    scale(0.95);

                opacity:
                    0.7;
            }

            50% {
                transform:
                    scale(1.08);

                opacity:
                    1;
            }

        }


        /* =====================================================
           MAIN CARD
        ===================================================== */

        .container {

            position: relative;

            z-index: 10;

            width:
                min(90vw, 620px);

            padding:
                45px 40px;

            margin-right:
                min(15vw, 160px);

            text-align:
                center;

            background:
                linear-gradient(
                    135deg,
                    rgba(35, 12, 30, 0.78),
                    rgba(12, 5, 12, 0.68)
                );

            border:
                1px solid
                rgba(255, 120, 210, 0.14);

            border-radius:
                30px;

            backdrop-filter:
                blur(28px);

            -webkit-backdrop-filter:
                blur(28px);

            box-shadow:

                0 30px 100px
                rgba(0, 0, 0, 0.70),

                0 0 80px
                rgba(255, 0, 170, 0.08),

                inset 0 1px 0
                rgba(255, 180, 230, 0.08);

            animation:
                cardAppear 0.8s ease-out;

        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* =====================================================
           PROFILE
        ===================================================== */

        .pfp-wrapper {

            position:
                relative;

            display:
                inline-block;

            margin-bottom:
                18px;

        }


        .pfp-glow {

            position:
                absolute;

            inset:
                -12px;

            border-radius:
                50%;

            background:
                rgba(255, 0, 160, 0.35);

            filter:
                blur(22px);

            animation:
                pfpGlow 2.5s ease-in-out infinite;

        }


        @keyframes pfpGlow {

            0%, 100% {

                opacity:
                    0.5;

                transform:
                    scale(0.95);

            }

            50% {

                opacity:
                    0.95;

                transform:
                    scale(1.08);

            }

        }


        .pfp {

            position:
                relative;

            width:
                105px;

            height:
                105px;

            border-radius:
                50%;

            object-fit:
                cover;

            border:
                4px solid
                #ff4db8;

            box-shadow:

                0 0 0 5px
                rgba(255, 0, 170, 0.10),

                0 0 40px
                rgba(255, 0, 170, 0.40);

        }


        h1 {

            margin:
                0;

            font-size:
                2.3rem;

            font-weight:
                750;

            letter-spacing:
                -1px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb6e6
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;

        }


        .handle {

            margin-top:
                6px;

            color:
                #c58aaa;

            font-size:
                1rem;

        }


        /* =====================================================
           LIVE
        ===================================================== */

        .live {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                8px;

            margin-top:
                22px;

            padding:
                7px 14px;

            border-radius:
                999px;

            background:
                rgba(255, 0, 170, 0.10);

            border:
                1px solid
                rgba(255, 70, 190, 0.28);

            color:
                #ff70c8;

            font-size:
                0.75rem;

            font-weight:
                800;

            letter-spacing:
                1.5px;

        }


        .live-dot {

            width:
                8px;

            height:
                8px;

            border-radius:
                50%;

            background:
                #ff209d;

            box-shadow:
                0 0 12px
                #ff209d;

            animation:
                pulse 1.4s infinite;

        }


        @keyframes pulse {

            0%, 100% {

                opacity:
                    1;

                transform:
                    scale(1);

            }

            50% {

                opacity:
                    0.3;

                transform:
                    scale(0.7);

            }

        }


        /* =====================================================
           COUNTER
        ===================================================== */

        .counter {

            margin:
                27px 0 5px;

            font-size:
                clamp(4rem, 12vw, 6rem);

            line-height:
                1;

            font-weight:
                800;

            letter-spacing:
                -4px;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #ffd6ef 45%,
                    #d66aaa 100%
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            color:
                transparent;

            transition:
                transform 0.25s ease,
                filter 0.25s ease;

        }


        .counter.bump {

            transform:
                scale(1.08);

            filter:
                drop-shadow(
                    0 0 25px
                    rgba(255, 20, 170, 0.55)
                );

        }


        .label {

            color:
                #a86d91;

            font-size:
                0.8rem;

            text-transform:
                uppercase;

            letter-spacing:
                4px;

        }


        /* =====================================================
           GOAL BOX
        ===================================================== */

        .goal-box {

            position:
                relative;

            margin-top:
                32px;

            padding:
                20px;

            text-align:
                left;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 80, 190, 0.08),
                    rgba(255, 255, 255, 0.018)
                );

            border:
                1px solid
                rgba(255, 120, 210, 0.13);

            border-radius:
                18px;

            box-shadow:

                inset 0 1px 0
                rgba(255, 180, 230, 0.05),

                0 10px 35px
                rgba(0, 0, 0, 0.25),

                0 0 30px
                rgba(255, 0, 170, 0.04);

            overflow:
                hidden;

        }


        .goal-box::before {

            content:
                "";

            position:
                absolute;

            left:
                0;

            top:
                0;

            bottom:
                0;

            width:
                3px;

            background:
                linear-gradient(
                    180deg,
                    #ff1493,
                    #ff69c4,
                    #c00078
                );

            box-shadow:
                0 0 18px
                rgba(255, 20, 160, 0.7);

        }


        .goal-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                12px;

        }


        .goal-title {

            font-size:
                0.85rem;

            font-weight:
                700;

            color:
                #c28aaa;

            text-transform:
                uppercase;

            letter-spacing:
                1.5px;

        }


        .goal-number {

            font-size:
                0.9rem;

            font-weight:
                700;

            color:
                #ff9ed8;

            text-shadow:
                0 0 10px
                rgba(255, 50, 180, 0.35);

        }


        .progress {

            width:
                100%;

            height:
                9px;

            background:
                rgba(255, 255, 255, 0.06);

            border-radius:
                999px;

            overflow:
                hidden;

            box-shadow:
                inset 0 1px 3px
                rgba(0, 0, 0, 0.5);

        }


        .progress-bar {

            height:
                100%;

            width:
                0%;

            background:
                linear-gradient(
                    90deg,
                    #c00078,
                    #ff1493,
                    #ff72c6
                );

            border-radius:
                inherit;

            box-shadow:
                0 0 18px
                rgba(255, 20, 160, 0.65);

            transition:
                width 0.8s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );

        }


        .goal-footer {

            display:
                flex;

            justify-content:
                space-between;

            margin-top:
                9px;

            font-size:
                0.75rem;

            color:
                #76516a;

        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {

            margin-top:
                22px;

            color:
                #76566c;

            font-size:
                0.75rem;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 850px) {

            .character {

                opacity:
                    0.25;

                right:
                    -80px;

                width:
                    400px;

            }

            .character-glow {

                right:
                    -50px;

            }

            .container {

                margin-right:
                    0;

            }

        }


        @media (max-width: 500px) {

            .container {

                width:
                    92vw;

                padding:
                    35px 22px;

            }

            .character {

                display:
                    none;

            }

            .pfp {

                width:
                    85px;

                height:
                    85px;

            }

            h1 {

                font-size:
                    1.9rem;

            }

            .counter {

                letter-spacing:
                    -2px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background">

        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>

        <div class="shape one"></div>
        <div class="shape two"></div>
        <div class="shape three"></div>
        <div class="shape four"></div>

    </div>


    <!-- =====================================================
         YUKI
    ====================================================== -->

    <div class="character-glow"></div>

    <img
        class="character"
        src="https://static.wikia.nocookie.net/vsbattles/images/5/55/Yuki_Takeya_-_Pre-Timeskip.png/revision/latest?cb=20211202134015"
        alt=""
    >


    <!-- =====================================================
         MAIN CARD
    ====================================================== -->

    <div class="container">


        <div class="pfp-wrapper">

            <div class="pfp-glow"></div>

            <img
                class="pfp"
                src="https://yt3.ggpht.com/ttAkTpY31wkOGnatdL3SG8reM98rZ2wVuG950Yno4ZCO9MMH1oyeIpT9ldBO-8KzAws6qeNT=s176-c-k-c0x00ffffff-no-rj"
                alt="GuiTakeya profile picture"
            >

        </div>


        <h1>
            GuiTakeya
        </h1>


        <div class="handle">
            @GuiTakeya
        </div>


        <div class="live">

            <span class="live-dot"></span>

            LIVE

        </div>


        <div
            class="counter"
            id="subCount"
        >
            —
        </div>


        <div class="label">
            Subscribers
        </div>


        <!-- =================================================
             GOAL
        ================================================== -->

        <div class="goal-box">

            <div class="goal-header">

                <div class="goal-title">
                    Next milestone
                </div>

                <div
                    class="goal-number"
                    id="goalText"
                >
                    100
                </div>

            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>


            <div class="goal-footer">

                <span id="currentGoalText">
                    0 / 100
                </span>

                <span>
                    Keep going! ♡
                </span>

            </div>

        </div>


        <div
            class="status"
            id="status"
        >
            Connecting...
        </div>


    </div>


    <!-- =====================================================
         SILK / KEEP-SILK-OPEN
    ====================================================== -->

    <script src="https://dagammla.gitlab.io/keep-silk-open/keep.js"></script>


    <!-- =====================================================
         SUBSCRIBER COUNTER
    ====================================================== -->

    <script>

        const API_URL =
            "https://api.socialcounts.org/youtube-live-subscriber-count/UChg7UoXV1HEtoUgwu0y871w";


        const subCount =
            document.getElementById(
                "subCount"
            );


        const status =
            document.getElementById(
                "status"
            );


        const progressBar =
            document.getElementById(
                "progressBar"
            );


        const goalText =
            document.getElementById(
                "goalText"
            );


        const currentGoalText =
            document.getElementById(
                "currentGoalText"
            );


        let previousCount =
            null;


        async function fetchSubCount() {

            try {

                const response =
                    await fetch(
                        API_URL,
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                const count =
                    data?.counters?.api?.subscriberCount ??
                    data?.counters?.estimation?.subscriberCount;


                if (
                    typeof count !==
                    "number"
                ) {

                    console.log(
                        "API response:",
                        data
                    );

                    throw new Error(
                        "Subscriber count not found."
                    );

                }


                updateCounter(
                    count
                );


                status.innerText =
                    "● Live • Updated " +
                    new Date()
                        .toLocaleTimeString();

            }


            catch (error) {

                console.error(
                    "Error fetching subscriber count:",
                    error
                );


                status.innerText =
                    "Unable to update • Retrying...";

            }

        }


        function updateCounter(
            count
        ) {

            if (
                previousCount !==
                null &&
                previousCount !==
                count
            ) {

                subCount.classList.add(
                    "bump"
                );


                setTimeout(
                    () => {

                        subCount.classList.remove(
                            "bump"
                        );

                    },
                    250
                );

            }


            subCount.innerText =
                count.toLocaleString();


            previousCount =
                count;


            const goal =
                Math.ceil(
                    (count + 1) /
                    100
                ) * 100;


            const previousGoal =
                goal - 100;


            let progress =
                (
                    (count - previousGoal) /
                    (goal - previousGoal)
                ) * 100;


            progress =
                Math.min(
                    Math.max(
                        progress,
                        0
                    ),
                    100
                );


            progressBar.style.width =
                progress + "%";


            goalText.innerText =
                goal.toLocaleString();


            currentGoalText.innerText =
                count.toLocaleString() +
                " / " +
                goal.toLocaleString();

        }


        /*
         * Load immediately.
         */

        fetchSubCount();


        /*
         * Update every 60 seconds.
         *
         * This DOES NOT refresh
         * the webpage.
         */

        setInterval(
            fetchSubCount,
            60000
        );

    </script>


</body>
</html>
