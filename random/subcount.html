<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GuiTakeya — Live Subscriber Count</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 50% 0%, #2a1111 0%, transparent 45%),
                linear-gradient(135deg, #090909, #111111 50%, #080808);

            color: white;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #ff0000;
            filter: blur(180px);
            opacity: 0.08;
            border-radius: 50%;
            pointer-events: none;
        }

        .container {
            position: relative;

            width: min(90vw, 620px);
            padding: 45px 40px;

            text-align: center;

            background: rgba(25, 25, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 28px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(15px);
        }

        .pfp {
            width: 105px;
            height: 105px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid #ff0000;

            box-shadow:
                0 0 0 6px rgba(255, 0, 0, 0.12),
                0 0 35px rgba(255, 0, 0, 0.35);

            margin-bottom: 18px;
        }

        h1 {
            margin: 0;

            font-size: 2.3rem;
            font-weight: 700;

            letter-spacing: -1px;
        }

        .handle {
            margin-top: 6px;

            color: #999;

            font-size: 1.05rem;
        }

        .live {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            margin-top: 22px;
            padding: 7px 13px;

            border-radius: 999px;

            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.25);

            color: #ff4b4b;

            font-size: 0.8rem;
            font-weight: 700;

            letter-spacing: 1px;
        }

        .live-dot {
            width: 8px;
            height: 8px;

            background: #ff0000;
            border-radius: 50%;

            box-shadow: 0 0 10px #ff0000;

            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.35;
                transform: scale(0.7);
            }
        }

        .counter {
            margin: 25px 0 5px;

            font-size: clamp(4rem, 12vw, 6rem);
            line-height: 1;

            font-weight: 800;

            letter-spacing: -3px;

            font-family: "Segoe UI", sans-serif;

            background: linear-gradient(
                180deg,
                #ffffff 0%,
                #eeeeee 45%,
                #aaaaaa 100%
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            transition: transform 0.2s ease;
        }

        .counter.bump {
            transform: scale(1.05);
        }

        .label {
            color: #888;

            font-size: 0.9rem;
            text-transform: uppercase;

            letter-spacing: 3px;
        }

        .goal {
            margin-top: 32px;
            text-align: left;
        }

        .goal-header {
            display: flex;
            justify-content: space-between;

            margin-bottom: 9px;

            font-size: 0.85rem;
            color: #999;
        }

        .progress {
            width: 100%;
            height: 8px;

            background: #2b2b2b;

            border-radius: 999px;

            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;

            background: linear-gradient(
                90deg,
                #ff0000,
                #ff4444
            );

            border-radius: inherit;

            box-shadow: 0 0 15px rgba(255, 0, 0, 0.45);

            transition: width 0.8s ease;
        }

        .status {
            margin-top: 25px;

            color: #666;

            font-size: 0.8rem;
        }

        @media (max-width: 500px) {
            .container {
                padding: 35px 22px;
            }

            h1 {
                font-size: 1.9rem;
            }

            .pfp {
                width: 85px;
                height: 85px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            class="pfp"
            src="https://yt3.ggpht.com/ttAkTpY31wkOGnatdL3SG8reM98rZ2wVuG950Yno4ZCO9MMH1oyeIpT9ldBO-8KzAws6qeNT=s176-c-k-c0x00ffffff-no-rj"
            alt="GuiTakeya profile picture"
        >

        <h1>GuiTakeya</h1>

        <div class="handle">
            @GuiTakeya
        </div>

        <div class="live">
            <span class="live-dot"></span>
            LIVE
        </div>

        <div class="counter" id="subCount">
            —
        </div>

        <div class="label">
            Subscribers
        </div>

        <div class="goal">

            <div class="goal-header">
                <span>Next goal</span>
                <span id="goalText">100</span>
            </div>

            <div class="progress">
                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>
            </div>

        </div>

        <div class="status" id="status">
            Connecting...
        </div>

    </div>

    <script>

        const API_URL =
            "https://api.socialcounts.org/youtube-live-subscriber-count/UChg7UoXV1HEtoUgwu0y871w";

        const subCount =
            document.getElementById("subCount");

        const status =
            document.getElementById("status");

        const progressBar =
            document.getElementById("progressBar");

        const goalText =
            document.getElementById("goalText");

        let previousCount = null;


        async function fetchSubCount() {

            try {

                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}`
                    );
                }

                const data = await response.json();

                const count =
                    data?.counters?.api?.subscriberCount ??
                    data?.counters?.estimation?.subscriberCount;

                if (typeof count !== "number") {
                    throw new Error(
                        "Subscriber count not found in API response."
                    );
                }

                updateCounter(count);

                status.innerText =
                    "Last updated: " +
                    new Date().toLocaleTimeString();

            } catch (error) {

                console.error(
                    "Error fetching subscriber count:",
                    error
                );

                status.innerText =
                    "Unable to update • Retrying...";

            }
        }


        function updateCounter(count) {

            const formatted =
                count.toLocaleString();

            if (
                previousCount !== null &&
                previousCount !== count
            ) {

                subCount.classList.add("bump");

                setTimeout(() => {
                    subCount.classList.remove("bump");
                }, 200);
            }

            subCount.innerText = formatted;

            previousCount = count;


            const goal =
                Math.ceil((count + 1) / 100) * 100;

            const previousGoal =
                goal - 100;

            const progress =
                ((count - previousGoal) /
                (goal - previousGoal)) * 100;

            progressBar.style.width =
                Math.min(Math.max(progress, 0), 100) + "%";

            goalText.innerText =
                goal.toLocaleString();
        }


        fetchSubCount();

        setInterval(fetchSubCount, 60000);

    </script>

</body>
</html>
```
