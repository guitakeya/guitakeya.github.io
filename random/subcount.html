<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=960, height=480, initial-scale=1.0">

    <title>GuiTakeya Live Sub Count</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 960px;
            height: 480px;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #08030b;
        }

        body {
            position: relative;

            color: white;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            user-select: none;
        }


        /* =====================================================
           BACKGROUND VIDEO
        ===================================================== */

        #backgroundVideo {
            position: fixed;

            top: 0;
            left: 0;

            width: 960px;
            height: 480px;

            min-width: 960px;
            min-height: 480px;

            max-width: 960px;
            max-height: 480px;

            object-fit: cover;

            z-index: 0;

            pointer-events: none;

            background: #08030b;
        }


        /* Dark overlay so text stays readable */
        .backgroundOverlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 960px;
            height: 480px;

            z-index: 1;

            pointer-events: none;

            background:
                linear-gradient(
                    135deg,
                    rgba(20, 0, 25, 0.48),
                    rgba(0, 0, 0, 0.30)
                );
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .screen {
            position: relative;

            width: 960px;
            height: 480px;

            overflow: hidden;

            z-index: 2;
        }


        /* =====================================================
           GLASS BOX
        ===================================================== */

        .glass {
            background: rgba(20, 10, 25, 0.76);

            border: 1px solid rgba(255, 150, 230, 0.30);

            border-radius: 20px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.45),
                inset 0 0 25px rgba(255, 100, 220, 0.035);
        }


        /* =====================================================
           TOP LEFT BRAND
        ===================================================== */

        .brand {
            position: absolute;

            left: 32px;
            top: 25px;

            width: 330px;
            height: 90px;

            display: flex;

            align-items: center;

            gap: 18px;

            padding: 12px 18px;

            z-index: 5;
        }


        .pfp {
            width: 68px;
            height: 68px;

            border-radius: 50%;

            object-fit: cover;

            border: 3px solid rgba(255, 170, 240, 0.75);

            box-shadow:
                0 0 18px rgba(255, 100, 220, 0.45);
        }


        .brandText {
            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .channelName {
            font-size: 28px;

            font-weight: 800;

            line-height: 1;

            letter-spacing: 0.5px;

            text-shadow:
                0 0 14px rgba(255, 100, 220, 0.45);
        }


        .handle {
            margin-top: 7px;

            font-size: 17px;

            color: rgba(255, 220, 250, 0.68);
        }


        /* =====================================================
           GREETING
        ===================================================== */

        .greeting {
            position: absolute;

            right: 32px;
            top: 28px;

            font-size: 25px;

            font-weight: 700;

            color: #ffd5f5;

            text-align: right;

            text-shadow:
                0 0 14px rgba(255, 100, 220, 0.45);

            z-index: 5;
        }


        /* =====================================================
           LIVE INDICATOR
        ===================================================== */

        .live {
            position: absolute;

            right: 32px;
            top: 68px;

            display: flex;

            align-items: center;

            gap: 9px;

            padding: 7px 13px;

            border-radius: 999px;

            background: rgba(255, 40, 90, 0.13);

            border: 1px solid rgba(255, 80, 120, 0.32);

            color: #ff8fae;

            font-size: 14px;

            font-weight: 700;

            z-index: 5;
        }


        .liveDot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #ff426d;

            box-shadow:
                0 0 10px rgba(255, 50, 100, 0.9);

            animation: pulse 1.5s infinite;
        }


        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }

            100% {
                opacity: 1;
            }
        }


        /* =====================================================
           SUBSCRIBER BOX
        ===================================================== */

        .subscriberBox {
            position: absolute;

            left: 32px;
            top: 135px;

            width: 520px;
            height: 190px;

            padding: 20px 28px;

            text-align: center;

            z-index: 4;
        }


        .subLabel {
            font-size: 18px;

            font-weight: 700;

            letter-spacing: 3px;

            color: rgba(255, 210, 245, 0.65);

            margin-bottom: 2px;
        }


        .counter {
            font-family: monospace;

            font-size: 88px;

            font-weight: 900;

            line-height: 1;

            letter-spacing: 2px;

            color: #ffffff;

            text-shadow:
                0 0 20px rgba(255, 100, 220, 0.65),
                0 0 45px rgba(255, 60, 190, 0.25);
        }


        /* =====================================================
           MILESTONE
        ===================================================== */

        .milestone {
            position: absolute;

            left: 575px;
            top: 135px;

            width: 353px;
            height: 190px;

            padding: 20px 24px;

            z-index: 4;
        }


        .milestoneTitle {
            font-size: 15px;

            font-weight: 800;

            letter-spacing: 2px;

            color: rgba(255, 210, 245, 0.62);

            margin-bottom: 5px;
        }


        .goalText {
            font-size: 29px;

            font-weight: 800;

            margin-bottom: 14px;
        }


        .progressTrack {
            width: 100%;
            height: 15px;

            overflow: hidden;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 180, 235, 0.16);
        }


        .progressBar {
            height: 100%;

            width: 95%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #ff4fba,
                    #ff91dc,
                    #ffd1f1
                );

            box-shadow:
                0 0 16px rgba(255, 80, 200, 0.55);

            transition: width 0.6s ease;
        }


        .progressText {
            margin-top: 10px;

            font-size: 16px;

            color: rgba(255, 225, 248, 0.72);
        }


        /* =====================================================
           TIME BOX
        ===================================================== */

        .timeBox {
            position: absolute;

            left: 32px;
            bottom: 28px;

            width: 220px;
            height: 65px;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 4;
        }


        #clock {
            font-family: monospace;

            font-size: 30px;

            font-weight: 800;

            color: #ffe5f8;

            text-shadow:
                0 0 12px rgba(255, 100, 220, 0.45);
        }


        /* =====================================================
           CHANNEL DATA BOX
        ===================================================== */

        .dataBox {
            position: absolute;

            left: 270px;
            bottom: 28px;

            width: 658px;
            height: 65px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 10px 25px;

            z-index: 4;

            text-align: center;
        }


        #channelData {
            font-size: 21px;

            font-weight: 700;

            color: rgba(255, 235, 250, 0.88);

            text-shadow:
                0 0 10px rgba(255, 100, 220, 0.25);
        }


        /* =====================================================
           SMALL UPDATE STATUS
        ===================================================== */

        #status {
            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            bottom: 5px;

            font-size: 9px;

            color: rgba(255, 255, 255, 0.28);

            z-index: 5;
        }


        /* =====================================================
           SAFETY
        ===================================================== */

        img,
        video,
        div {
            max-width: 100%;
        }

    </style>
</head>


<body>

    <!-- =====================================================
         BACKGROUND VIDEO
    ====================================================== -->

    <video
        id="backgroundVideo"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >
        <source src="takeya.mp4" type="video/mp4">
    </video>


    <div class="backgroundOverlay"></div>


    <!-- Silk compatibility script -->
    <script src="https://dagammla.gitlab.io/keep-silk-open/keep.js"></script>


    <main class="screen">


        <!-- =================================================
             BRAND
        ================================================== -->

        <div class="brand glass">

            <img
                class="pfp"
                src="https://yt3.ggpht.com/ttAkTpY31wkOGnatdL3SG8reM98rZ2wVuG950Yno4ZCO9MMH1oyeIpT9ldBO-8KzAws6qeNT=s176-c-k-c0x00ffffff-no-rj"
                alt="GuiTakeya"
            >

            <div class="brandText">

                <div class="channelName">
                    GuiTakeya
                </div>

                <div class="handle">
                    @GuiTakeya
                </div>

            </div>

        </div>


        <!-- =================================================
             GREETING
        ================================================== -->

        <div
            class="greeting"
            id="greeting"
        >
            Good Morning, Takeya!
        </div>


        <!-- =================================================
             LIVE
        ================================================== -->

        <div class="live">

            <span class="liveDot"></span>

            LIVE

        </div>


        <!-- =================================================
             SUBSCRIBER COUNT
        ================================================== -->

        <div class="subscriberBox glass">

            <div class="subLabel">
                SUBSCRIBERS
            </div>

            <div
                class="counter"
                id="subCount"
            >
                Loading...
            </div>

        </div>


        <!-- =================================================
             MILESTONE
        ================================================== -->

        <div class="milestone glass">

            <div class="milestoneTitle">
                NEXT MILESTONE
            </div>

            <div
                class="goalText"
                id="goalText"
            >
                100 Subscribers
            </div>

            <div class="progressTrack">

                <div
                    class="progressBar"
                    id="progressBar"
                ></div>

            </div>

            <div
                class="progressText"
                id="progressText"
            >
                95 / 100
            </div>

        </div>


        <!-- =================================================
             CLOCK
        ================================================== -->

        <div class="timeBox glass">

            <div id="clock">
                12:00 AM
            </div>

        </div>


        <!-- =================================================
             CHANNEL DATA
        ================================================== -->

        <div class="dataBox glass">

            <div id="channelData">
                Loading channel data...
            </div>

        </div>


        <div id="status">
            Connecting...
        </div>


    </main>


    <script>

        /* =====================================================
           BACKGROUND VIDEO
        ===================================================== */

        const video =
            document.getElementById(
                "backgroundVideo"
            );


        video.muted = true;
        video.loop = true;


        function playBackground() {

            video.play().catch(() => {

                console.log(
                    "Background video autoplay was blocked."
                );

            });

        }


        playBackground();


        video.addEventListener(
            "ended",
            () => {

                video.currentTime = 0;

                playBackground();

            }
        );


        /* =====================================================
           GREETING
        ===================================================== */

        function updateGreeting() {

            const hour =
                new Date().getHours();


            let greeting;


            if (hour >= 5 && hour < 12) {

                greeting =
                    "Good Morning, Takeya!";

            }

            else if (hour >= 12 && hour < 18) {

                greeting =
                    "Good Afternoon, Takeya!";

            }

            else {

                greeting =
                    "Good Evening, Takeya!";

            }


            document.getElementById(
                "greeting"
            ).innerText = greeting;

        }


        updateGreeting();


        /* =====================================================
           CLOCK
        ===================================================== */

        function updateClock() {

            const now =
                new Date();


            let hours =
                now.getHours();

            const minutes =
                String(
                    now.getMinutes()
                ).padStart(2, "0");


            const suffix =
                hours >= 12
                    ? "PM"
                    : "AM";


            hours =
                hours % 12 || 12;


            document.getElementById(
                "clock"
            ).innerText =
                `${hours}:${minutes} ${suffix}`;

        }


        updateClock();


        setInterval(
            updateClock,
            1000
        );


        setInterval(
            updateGreeting,
            60000
        );


        /* =====================================================
           SUBSCRIBER DATA
        ===================================================== */

        const API_URL =
            "https://api.socialcounts.org/youtube-live-subscriber-count/UChg7UoXV1HEtoUgwu0y871w";


        async function fetchSubCount() {

            try {

                const response =
                    await fetch(
                        API_URL,
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                let count;


                /*
                    SocialCounts can return
                    the subscriber count in
                    different structures.
                */

                if (
                    data.subCount !== undefined
                ) {

                    count =
                        Number(
                            data.subCount
                        );

                }

                else if (
                    data.counters &&
                    data.counters.api &&
                    data.counters.api.subscriberCount
                    !== undefined
                ) {

                    count =
                        Number(
                            data.counters
                                .api
                                .subscriberCount
                        );

                }

                else if (
                    data.counters &&
                    data.counters.estimation &&
                    data.counters.estimation
                        .subscriberCount
                    !== undefined
                ) {

                    count =
                        Number(
                            data.counters
                                .estimation
                                .subscriberCount
                        );

                }


                if (
                    count === undefined ||
                    Number.isNaN(count)
                ) {

                    throw new Error(
                        "Subscriber count not found."
                    );

                }


                document.getElementById(
                    "subCount"
                ).innerText =
                    count.toLocaleString();


                updateMilestone(
                    count
                );


                document.getElementById(
                    "status"
                ).innerText =
                    "Updated " +
                    new Date()
                        .toLocaleTimeString(
                            [],
                            {
                                hour: "numeric",
                                minute: "2-digit"
                            }
                        );


            }

            catch (error) {

                console.error(
                    "Error fetching subscriber data:",
                    error
                );


                document.getElementById(
                    "status"
                ).innerText =
                    "Retrying...";

            }

        }


        /* =====================================================
           MILESTONE
        ===================================================== */

        function updateMilestone(
            subscribers
        ) {

            /*
                Find the next 100-sub milestone.

                95  → 100
                100 → 200
                234 → 300
                999 → 1000
            */

            let goal;


            if (
                subscribers < 100
            ) {

                goal = 100;

            }

            else {

                goal =
                    Math.ceil(
                        (subscribers + 1) / 100
                    ) * 100;

            }


            const previousGoal =
                goal - 100;


            const progress =
                Math.max(
                    0,
                    Math.min(
                        100,
                        (
                            (subscribers -
                                previousGoal)
                            /
                            (goal -
                                previousGoal)
                        ) * 100
                    )
                );


            document.getElementById(
                "goalText"
            ).innerText =
                `${goal.toLocaleString()} Subscribers`;


            document.getElementById(
                "progressText"
            ).innerText =
                `${subscribers.toLocaleString()} / ${goal.toLocaleString()}`;


            document.getElementById(
                "progressBar"
            ).style.width =
                `${progress}%`;

        }


        /* =====================================================
           CHANNEL DATA
        ===================================================== */

        let cachedChannelData =
            null;


        async function fetchChannelData() {

            try {

                const response =
                    await fetch(
                        "channel-data.json",
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                cachedChannelData =
                    await response.json();


            }

            catch (error) {

                console.error(
                    "Could not load channel data:",
                    error
                );

            }

        }


        /*
            These are intentionally simple for now.
            We can replace them with the new
            multi-page system later.
        */

        const dataSlides = [

            () => {

                if (
                    !cachedChannelData ||
                    !cachedChannelData.current
                ) {

                    return "Channel data unavailable";

                }


                return (
                    `👀 ${
                        cachedChannelData
                            .current
                            .views
                            .toLocaleString()
                    } total views`
                );

            },


            () => {

                if (
                    !cachedChannelData ||
                    !cachedChannelData.current
                ) {

                    return "Channel data unavailable";

                }


                return (
                    `🎬 ${
                        cachedChannelData
                            .current
                            .videos
                            .toLocaleString()
                    } videos uploaded`
                );

            },


            () => {

                if (
                    !cachedChannelData ||
                    !cachedChannelData.current
                ) {

                    return "Channel data unavailable";

                }


                const history =
                    cachedChannelData.history || [];


                if (
                    history.length < 2
                ) {

                    return "📊 History tracking started today";

                }


                const first =
                    history[0];

                const latest =
                    history[
                        history.length - 1
                    ];


                const growth =
                    latest.subscribers -
                    first.subscribers;


                const sign =
                    growth >= 0
                        ? "+"
                        : "";


                return (
                    `📈 ${
                        sign
                    }${
                        growth
                    } subscribers since tracking began`
                );

            },


            () => {

                const messages = [

                    "💗 Keep going, Takeya!",
                    "🚀 You're doing great!",
                    "🎸 Keep shredding!",
                    "✨ One step closer to 100K!",
                    "🔥 Keep cooking!",
                    "💪 Don't stop now!",
                    "🌟 The channel is growing!"

                ];


                return messages[
                    Math.floor(
                        Math.random() *
                        messages.length
                    )
                ];

            }

        ];


        let currentSlide =
            0;


        function updateChannelData() {

            const element =
                document.getElementById(
                    "channelData"
                );


            if (
                dataSlides.length === 0
            ) {

                return;

            }


            element.innerText =
                dataSlides[
                    currentSlide
                ]();


            currentSlide =
                (
                    currentSlide + 1
                ) %
                dataSlides.length;

        }


        /* =====================================================
           INITIAL LOAD
        ===================================================== */

        fetchSubCount();

        fetchChannelData();

        updateChannelData();


        /* =====================================================
           30 SECOND SUBSCRIBER REFRESH
        ===================================================== */

        setInterval(
            fetchSubCount,
            30000
        );


        /* =====================================================
           CHANNEL DATA REFRESH
        ===================================================== */

        setInterval(
            async () => {

                await fetchChannelData();

                updateChannelData();

            },
            30000
        );


        /* =====================================================
           CHANGE DATA SLIDE
        ===================================================== */

        setInterval(
            updateChannelData,
            8000
        );

    </script>

</body>
</html>
